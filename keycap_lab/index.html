<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycap Lab</title>
<style>
:root{--bg:#0e0f11;--panel:#141518;--fg:#e8e6e1;--dim:#7d7a74;--line:#26272b;--acc:#ffb547}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
#app{display:grid;grid-template-columns:190px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 0}
nav h2{font-size:11px;font-weight:500;color:var(--dim);margin:14px 18px 4px;letter-spacing:.08em}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:5px 18px;cursor:pointer;opacity:.72}
nav button:hover{opacity:1}
nav button.on{opacity:1;color:var(--acc)}
main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
header{display:flex;gap:24px;align-items:flex-start;padding:18px 24px 0}
#head{flex:1;min-width:0}
h1{font-size:22px;font-weight:600;margin:0}
#note,#use{margin:2px 0 0;color:var(--dim)}
#use:before{content:"→ "}
#opts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--fg)}
#opts input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;padding:4px 8px;border-radius:6px;width:300px}
#conn{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
#conn.live{border-color:var(--acc);color:var(--acc)}
#conn.warn{border-color:#e5484d;color:#e5484d}
canvas{width:100%;height:100%;display:block;touch-action:none}
footer{display:flex;gap:28px;align-items:center;padding:10px 24px 16px;color:var(--dim);font-size:12px}
footer label{display:flex;gap:8px;align-items:center}
footer input{width:130px;accent-color:var(--acc)}
footer output{width:44px;color:var(--fg)}
#keys{margin-left:auto}
#status{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <nav id="list"></nav>
  <main>
    <header>
      <div id="head"><h1 id="name"></h1><p id="note"></p><p id="use"></p></div>
      <div id="opts"></div>
      <button id="conn"></button>
    </header>
    <canvas id="cv"></canvas>
    <footer>
      <label>速さ <input id="spd" type="range" min="0.25" max="3" step="0.05" value="1"><output></output></label>
      <label>強さ <input id="str" type="range" min="5" max="100" step="1" value="100"><output></output></label>
      <label>駆動時間 <input id="len" type="range" min="30" max="400" step="5" value="150"><output></output></label>
      <span id="status"></span>
      <span id="keys">Space 一時停止　Esc 止める　asdfjkl; 手で打つ・白いキーを押す</span>
    </footer>
  </main>
</div>
<script>
'use strict';
// ---- 基本 ----
const $ = id => document.getElementById(id);
const NAMES = ['A', 'S', 'D', 'F', 'J', 'K', 'L', ';'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = n => Math.floor(Math.random() * n);
const pick = a => a[ri(a.length)];
const now = () => performance.now();
const P = {spd: 1, str: 100, len: 150};   // 速さ（倍）・強さ（PWM %）・駆動時間（ms。キーが立ち上がるのに要る長さ。どの打鍵もこれより短くしない）

// ---- 基板（Web Serial） ----
// P key ms duty kick hz … 1本を ms だけ動かす ／ F ttl kick d0..d7 … 8本の強さをまとめて（動き続けるもの）／ X … 全部止める
const enc = new TextEncoder();
let port = null, writer = null, reader = null, version = '';
function send(line) { if (writer) writer.write(enc.encode(line + '\n')).catch(() => {}); }
async function openPort(p) {
  port = p;
  await port.open({baudRate: 115200});
  writer = port.writable.getWriter();
  readLoop(port);
  send('V');
  connUI();
}
async function readLoop(p) {
  const dec = new TextDecoder();
  let buf = '';
  reader = p.readable.getReader();
  try {
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
    }
  } catch (e) {} finally { reader.releaseLock(); }
}
function onLine(l) {
  let m;
  if ((m = l.match(/^(?:VERSION|READY) ([A-Z].*)$/))) version = m[1];
  else if ((m = l.match(/^REST (\d)/))) sim[+m[1]].rest = true;
  else if ((m = l.match(/^AWAKE (\d)/))) sim[+m[1]].rest = false;
  else if ((m = l.match(/^RAISED ([0-9A-F]+)/i))) boardRaised = parseInt(m[1], 16);
  else if ((m = l.match(/^DOWN (\d)/))) firePress(+m[1]);
  else if ((m = l.match(/^UP (\d)/))) fireRelease(+m[1]);
  else if ((m = l.match(/^SENSE (.*)/))) sense = m[1].trim().split(/\s+/).map(v => v.split('/').map(Number));
  else if ((m = l.match(/^(?:AUTO KEY|CAL CONTACT) (\d)/))) calKeys[+m[1]] = 'ok';
  else if ((m = l.match(/^(?:AUTO SKIP|CAL SKIP) (\d)/))) calKeys[+m[1]] = 'skip';
  else if ((m = l.match(/^CAL DATA (\d)/))) calKeys[+m[1]] = /SKIPPED/.test(l) ? 'skip' : 'ok';
  else if (/^AUTO START/.test(l)) { calKeys.fill(null); status('校正中…キーに触れないでください'); }
  else if (/^CAL SAVED/.test(l)) status('校正を保存しました', 3000);
  else if (/^CAL (CANCELLED|TIMEOUT)/.test(l)) status('校正を中止しました', 3000);
  else if (/^(LISTEN ERROR|CAL PROFILE MISSING)/.test(l)) status('校正データがありません（「校正」でオートキャリブレーション）');
  connUI();
}
let statusTimer = 0;
function status(msg, ms = 0) {
  clearTimeout(statusTimer);
  $('status').textContent = msg;
  if (ms) statusTimer = setTimeout(() => $('status').textContent = paused ? '一時停止中' : '', ms);
}
async function closePort() {
  try { await writer.write(enc.encode('X\n')); writer.releaseLock(); await reader.cancel(); await port.close(); } catch (e) {}
  port = writer = reader = null; version = '';
  connUI();
}
function connUI() {
  const b = $('conn');
  b.className = '';
  if (!('serial' in navigator)) { b.textContent = 'Chrome で開いてください'; b.disabled = true; return; }
  if (!writer) { b.textContent = '基板に接続'; return; }
  if (version && !/KEYCAP-LAB-v[2-9]/.test(version)) { b.textContent = `${version}（keycap_lab.ino を書き込む）`; b.className = 'warn'; return; }
  b.textContent = version ? '接続中' : '接続中…';
  b.className = 'live';
}
$('conn').onclick = async () => {
  if (writer) return closePort();
  try { await openPort(await navigator.serial.requestPort()); } catch (e) { port = writer = null; connUI(); }
};
if ('serial' in navigator) {
  navigator.serial.getPorts().then(ps => { if (ps.length === 1 && !port) openPort(ps[0]).catch(() => { port = writer = null; connUI(); }); });
  navigator.serial.addEventListener('disconnect', e => { if (e.target === port) { port = writer = reader = null; version = ''; connUI(); } });
}

// ---- 出力（基板と、画面のキーの両方へ） ----
const sim = NAMES.map(() => ({active: false, start: 0, until: 0, duty: 0, kick: 0, hz: 0, lift: 0, rest: false}));
const lastHit = new Array(8).fill(-1e9);
let lastFrame = '', lastFrameAt = 0;
function hit(k, ms = P.len, duty = P.str, kick = 0, hz = 0) {
  if (paused || k < 0 || k > 7) return;
  ms = Math.round(clamp(Math.max(ms, P.len), 1, 5000)); duty = Math.round(clamp(duty, 0, 100));
  if (hz) hz = Math.min(hz, 500 / P.len);   // ふるえも、1回のオンが駆動時間より短くならない
  send(`P ${k} ${ms} ${duty} ${kick | 0} ${hz | 0}`);
  const t = now();
  Object.assign(sim[k], {active: true, start: t, until: t + ms, duty, kick, hz});
  lastHit[k] = t; lastFrame = '';
}
// 8本の強さ（0〜100）。続けて呼ぶと動き続け、呼ばなくなると ttl で止まる
// 上がり始めたキーは、駆動時間がたつまで下げない
const frameHold = NAMES.map(() => ({until: 0, duty: 0}));
function frame(d, ttl = 160, kick = 0) {
  if (paused) return;
  const t = now();
  d = d.map((v, k) => {
    v = Math.round(clamp(v || 0, 0, 100));
    const hold = frameHold[k];
    if (v && !(sim[k].active && t <= sim[k].until)) { hold.until = t + P.len; hold.duty = v; }
    return v || (t < hold.until ? hold.duty : 0);
  });
  const key = d.join(' ');
  if (key === lastFrame && (t - lastFrameAt < ttl * 0.45 || d.every(v => !v))) return;
  lastFrame = key; lastFrameAt = t;
  send(`F ${ttl} ${kick} ${key}`);
  d.forEach((v, k) => {
    const s = sim[k];
    if (!v) { s.active = false; return; }
    if (!s.active || t > s.until) { Object.assign(s, {start: t, kick, hz: 0}); lastHit[k] = t; }
    Object.assign(s, {active: true, until: t + ttl, duty: v});
  });
}
function stopAll() { send('X'); sim.forEach(s => s.active = false); lastFrame = ''; listenMask = 0; pressed.fill(false); }
// あなたが押すキー：mask のキーを上げて待ち、押し込まれたら実験の press(s, k) を呼ぶ（基板からの DOWN、または PC のキー）
let listenMask = 0, boardRaised = 0, sense = null;
const pressed = new Array(8).fill(false), calKeys = new Array(8).fill(null);
function listen(mask) {
  if (paused) mask = 0;
  if (mask === listenMask) return;
  listenMask = mask;
  for (let i = 0; i < 8; i++) if (!(mask >> i & 1)) pressed[i] = false;
  send('U ' + mask.toString(16));
}
setInterval(() => { if (listenMask) send('U ' + listenMask.toString(16)); }, 300);   // 1秒途切れると基板が下げる
function firePress(k) {
  if (paused || !(listenMask >> k & 1) || pressed[k]) return;
  pressed[k] = true;
  cur.press?.(s, k, now());
}
function fireRelease(k) {
  if (!pressed[k]) return;
  pressed[k] = false;
  cur.release?.(s, k, now());
}
function simLevel(k, t) {
  const s = sim[k];
  if (!s.active || t > s.until) return 0;
  if (s.hz && t - s.start > s.kick && Math.floor((t - s.start - s.kick) / (500 / s.hz)) % 2) return 0;
  return 0.35 + 0.65 * s.duty / 100;
}

// ---- 時間 ----
const timers = new Set();
function at(ms, fn) { const id = setTimeout(() => { timers.delete(id); fn(); }, Math.max(0, ms)); timers.add(id); }
function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

// ---- 音 ----
let AC = null;
function audio() { if (!AC) AC = new AudioContext(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, ms = 200, vol = 0.12, type = 'sine') {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
}

// ---- 画面の配置（画面のキーと実物のキーを同じ並びにする） ----
const cv = $('cv'), g = cv.getContext('2d');
let W = 0, H = 0, STEP = 0, KY = 0, GROUND = 0;
const KX = [];
function layout() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  STEP = Math.min(W / 10.5, 120);
  for (let i = 0; i < 8; i++) KX[i] = W / 2 + (i - 3.5) * STEP + (i < 4 ? -1 : 1) * STEP * 0.3;
  KY = H - STEP * 0.7;
  GROUND = KY - STEP * 0.75;
}
const kx = i => KX[i];
function kToX(k) {
  if (k <= 0) return KX[0] + k * STEP;
  if (k >= 7) return KX[7] + (k - 7) * STEP;
  const i = Math.floor(k);
  return KX[i] + (KX[i + 1] - KX[i]) * (k - i);
}
function xToK(x) {
  if (x <= KX[0]) return (x - KX[0]) / STEP;
  if (x >= KX[7]) return 7 + (x - KX[7]) / STEP;
  for (let i = 0; i < 7; i++) if (x <= KX[i + 1]) return i + (x - KX[i]) / (KX[i + 1] - KX[i]);
}
const ptr = {x: 0, y: 0, down: false};
cv.addEventListener('pointerdown', e => { ptr.down = true; cv.setPointerCapture(e.pointerId); movePtr(e); });
cv.addEventListener('pointermove', movePtr);
cv.addEventListener('pointerup', () => ptr.down = false);
function movePtr(e) { const r = cv.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; }

// ---- 描画の道具 ----
const ACC = '#ffb547', FG = '#e8e6e1', DIM = '#7d7a74', LINE = '#26272b';
function alpha(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function dot(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function text(s, x, y, size, c = FG, align = 'center') { g.fillStyle = c; g.font = `500 ${size}px "Hiragino Sans","Noto Sans JP",sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); }
function glow(t, decay = 220) {   // 打ったキーの上に光の柱
  for (let i = 0; i < 8; i++) {
    const a = Math.exp(-(t - lastHit[i]) / decay);
    if (a < 0.02) continue;
    const grd = g.createLinearGradient(0, GROUND, 0, GROUND - STEP * 3);
    grd.addColorStop(0, alpha(ACC, 0.5 * a)); grd.addColorStop(1, alpha(ACC, 0));
    g.fillStyle = grd; g.fillRect(kx(i) - STEP * 0.3, GROUND - STEP * 3, STEP * 0.6, STEP * 3);
  }
}
function heart(x, y, s) {
  g.beginPath(); g.moveTo(x, y + 0.9 * s);
  g.bezierCurveTo(x - 1.25 * s, y + 0.05 * s, x - 0.85 * s, y - 1.05 * s, x, y - 0.4 * s);
  g.bezierCurveTo(x + 0.85 * s, y - 1.05 * s, x + 1.25 * s, y + 0.05 * s, x, y + 0.9 * s);
  g.fill();
}
const CARD_KEYS = [2, 3, 4, 5], WORDS = ['たのしい', 'ふつう', 'つまらない', 'ふしぎ'];
function cards(hl, sel, selColor = ACC) {
  const w = STEP * 0.92, h = STEP * 1.25, y = GROUND * 0.32;
  CARD_KEYS.forEach((k, i) => {
    const x = kx(k) - w / 2;
    rrect(x, y, w, h, 8);
    g.fillStyle = sel === i ? selColor : hl === i ? '#2a2b30' : '#18191c'; g.fill();
    g.strokeStyle = sel === i ? selColor : hl === i ? ACC : LINE; g.lineWidth = 1.5; g.stroke();
    text(WORDS[i], kx(k), y + h / 2, Math.min(STEP * 0.17, 18), sel === i ? '#111' : FG);
  });
  return y + h;
}
function drawKeys(t, dt) {
  const ks = STEP * 0.74;
  const onBoard = writer && /KEYCAP-LAB-v[2-9]/.test(version);
  for (let i = 0; i < 8; i++) {
    const s = sim[i], push = simLevel(i, t);
    const up = !push && (onBoard ? boardRaised : listenMask) >> i & 1 && !pressed[i] ? 1 : 0;
    s.lift += (push - s.lift) * Math.min(1, dt / 30);
    s.up = (s.up || 0) + (up - (s.up || 0)) * Math.min(1, dt / 40);
    const y = KY - Math.max(s.lift, s.up) * ks * 0.25;
    rrect(kx(i) - ks / 2, y - ks / 2 + 4, ks, ks, ks * 0.16); g.fillStyle = '#08090a'; g.fill();
    rrect(kx(i) - ks / 2, y - ks / 2, ks, ks, ks * 0.16);
    g.fillStyle = '#1d1e22'; g.fill();
    if (s.up > 0.02) { g.fillStyle = alpha(FG, s.up * 0.85); g.fill(); }
    if (s.lift > 0.02) { g.fillStyle = alpha(ACC, s.lift * 0.85); g.fill(); }
    g.strokeStyle = s.rest ? '#e5484d' : pressed[i] ? FG : '#34353a'; g.lineWidth = 1.5; g.stroke();
    text(NAMES[i], kx(i), y, ks * 0.3, Math.max(s.lift, s.up) > 0.5 ? '#111' : DIM);
  }
}

// ---- 文字 → 指（ホームポジションで打つときの指） ----
const FINGERS = ['qaz1!`', 'wsx2"', 'edc3#', 'rfvtgb45$%', 'yhnujm67&\'', 'ik,8(<', 'ol.9)>', 'p;/0-^@[]:?_=+~|{}'];
const fingerOf = ch => ch ? FINGERS.findIndex(s => s.includes(ch)) : -1;
const ROMA = {};
[['あいうえお', ['a', 'i', 'u', 'e', 'o']], ['かきくけこ', 'k'], ['さしすせそ', 's'], ['たちつてと', 't'], ['なにぬねの', 'n'],
 ['はひふへほ', 'h'], ['まみむめも', 'm'], ['やゆよ', ['ya', 'yu', 'yo']], ['らりるれろ', 'r'], ['わをん', ['wa', 'wo', 'nn']],
 ['がぎぐげご', 'g'], ['ざじずぜぞ', 'z'], ['だぢづでど', 'd'], ['ばびぶべぼ', 'b'], ['ぱぴぷぺぽ', 'p'],
 ['ぁぃぅぇぉ', 'l'], ['ゃゅょ', ['lya', 'lyu', 'lyo']]
].forEach(([ks, c]) => [...ks].forEach((ch, i) => ROMA[ch] = Array.isArray(c) ? c[i] : c + 'aiueo'[i]));
Object.assign(ROMA, {'ー': '-', '、': ',', '。': '.', '？': '?', '！': '!'});
function toMora(str) {
  const h = [...str].map(ch => { const c = ch.charCodeAt(0); return c >= 0x30A1 && c <= 0x30F6 ? String.fromCharCode(c - 0x60) : ch; });
  const out = [];
  for (let i = 0; i < h.length; i++) {
    const ch = h[i], nx = h[i + 1];
    if (ch === ' ' || ch === '　') { out.push({disp: ch, keys: '', space: true}); continue; }
    if (ch === 'っ') { const n = ROMA[nx] || ''; out.push({disp: ch, keys: /^[bcdfghjkmprstwz]/.test(n) ? n[0] : 'xtu'}); continue; }
    let r = ROMA[ch];
    if (r && r.length > 1 && r.endsWith('i') && 'ゃゅょ'.includes(nx || '×')) { out.push({disp: ch + nx, keys: r.slice(0, -1) + 'y' + ROMA[nx].slice(-1)}); i++; continue; }
    if (r) out.push({disp: ch, keys: r});
    else if (/[a-z0-9.,;\/\-!?]/i.test(ch)) out.push({disp: ch, keys: ch.toLowerCase()});
    else out.push({disp: ch, keys: ''});   // 漢字など：キーは打たずに出す
  }
  out.forEach((m, i) => { if (m.disp === 'ん' && /^[bcdfghjkmprstvwxz]/.test(out[i + 1]?.keys || '')) m.keys = 'n'; });
  return out;
}

// ---- 人らしい打鍵（who-typed-exhibition-scenario.html の CONFIG.rhythm と interKey と同じ） ----
const RHYTHM = {min: 65, max: 82, altHand: 0.82, sameHand: 1.0, rowJump: 1.15, sameFinger: 1.55, sameKey: 1.25, inMora: 0.9, moraStart: 1.12,
  phrasePause: [40, 140], commaPause: [180, 380], periodPause: [320, 560], hesitationChance: 0.04, hesitation: [140, 320], jitter: 0.15};
const ROWS = ['qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];
const rowOf = ch => { const r = ROWS.findIndex(x => x.includes(ch)); return r < 0 ? 1 : r; };
function interKey(a, b, moraStart) {
  let t = rand(RHYTHM.min, RHYTHM.max);
  const fa = fingerOf(a), fb = fingerOf(b);
  if (fa >= 0 && fb >= 0) {
    if (a === b) t *= RHYTHM.sameKey;
    else if ((fa < 4) !== (fb < 4)) t *= RHYTHM.altHand;
    else if (fa === fb) t *= RHYTHM.sameFinger;
    else { t *= RHYTHM.sameHand; if (Math.abs(rowOf(a) - rowOf(b)) === 2) t *= RHYTHM.rowJump; }
  }
  t *= moraStart ? RHYTHM.moraStart : RHYTHM.inMora;
  t *= 1 + (Math.random() * 2 - 1) * RHYTHM.jitter;
  if (moraStart && Math.random() < RHYTHM.hesitationChance) t += rand(...RHYTHM.hesitation);
  return t;
}
// 文を、その文字を打つ指で打つ。返す st の done（打ち終えた文字）と pend（入力中のローマ字）を描く。
// human = false は一定のテンポ。同じ指が続くときは、キーが戻るのを待つ
function typist(str, {human = true, onDone} = {}) {
  const st = {done: '', pend: '', m: toMora(str)};
  let mi = 0, ki = 0, lastF = -1, lastAt = 0;
  const step = () => {
    if (mi >= st.m.length) return onDone?.();
    const mo = st.m[mi];
    if (!mo.keys) { st.done += mo.disp; mi++; return at((mo.space ? rand(...RHYTHM.phrasePause) + 120 : 80) / P.spd, step); }

  step();

     if (a[i] > 0) s.a[i] = Math.min(1, a[i] + dt / 1000 * 0.2 * P.spd);
     else if ((a[i - 1] || 0) > 0.3 || (a[i + 1] || 0) > 0.3) s.a[i] = 0.02;
     if (s.a[i] > 0 && Math.random() < dt / 1000 * (0.6 + 10 * s.a[i] * s.a[i]) * P.spd) hit(i, P.len, P.str * (0.5 + 0.5 * s.a[i]));
   }
   if (s.a.every(v => v >= 1) && (s.full += dt) > 2200) { stopAll(); s.quiet = t + 2500; }
   g.lineWidth = 1.5;
   s.a.forEach((v, i) => { g.strokeStyle = alpha(ACC, 0.2 + 0.8 * v); g.beginPath(); for (let y = GROUND * 0.15; y <= GROUND; y += 8) g.lineTo(kx(i) + rand(-1, 1) * v * STEP * 0.3, y); g.stroke(); });
 }},
{id: 'drift', group: '気配', name: 'ずれ', note: 'メトロノームとキーが、ゆっくりずれては戻る', use: '同期していたものが、少しずつ外れていく違和感',
 opts: {snd: ['音あり', '音なし']},
 init(s) { s.n = 0; s.next = now() + 400; s.flash = -1e9; },
 draw(s, t) {
   while (s.next - t < 250) {
     const T = s.next, off = 160 * Math.sin(Math.PI * 2 * s.n / 24);
     at(T - t, () => { s.flash = now(); if (s.o.snd === '音あり') tone(1600, 30, 0.1, 'square'); });
     at(T + off - t, () => { hit(3); hit(4); });
     s.n++; s.next += 60000 / (90 * P.spd);
   }
   const a = Math.exp(-(t - s.flash) / 120);
   dot(W / 2, GROUND * 0.48, STEP * 0.25, alpha(FG, 0.15 + 0.85 * a));
 }},

// 打鍵
{id: 'type', group: '打鍵', name: '打たされる', note: '画面の文を、その文字を打つ指で打つ（ローマ字入力）。「人」は本編と同じ人らしいテンポ', use: 'who typed? の本体。誰が打った？',
 opts: {mode: ['人', '機械']}, text: 'これは わたしが うった ぶんです。',
 init(s) { const run = () => { s.st = typist(s.text, {human: s.o.mode === '人', onDone: () => at(2500, run)}); }; run(); },
 draw(s) { drawTyped(s.st, GROUND * 0.45); }},
{id: 'line', group: '打鍵', name: 'LINE', note: '友だちからのメッセージに、あなたの指が勝手に返信して送ってしまう', use: '自分のアカウントで、自分の指で、勝手にやり取りされる',
 init(s) {
   const SCRIPT = [['ゆうき', '今日ひま？'], ['me', 'ひまだよ'], ['ゆうき', 'じゃあ7時に駅で！'], ['me', 'ごめん、やっぱりいけない'], ['ゆうき', 'え、なんで？'], ['me', 'なんとなく'], ['ゆうき', '……そっか']];
   s.msgs = []; s.st = null;
   let i = 0;
   const next = () => {
     if (i >= SCRIPT.length) return at(4000, () => { s.msgs = []; i = 0; next(); });
     const [who, txt] = SCRIPT[i++];
     if (who !== 'me') return at(1100 / P.spd, () => { s.msgs.push({me: false, txt}); tone(1320, 60, 0.04); next(); });
     at(1300 / P.spd, () => { s.st = typist(txt, {onDone: () => at(450, () => { hit(7); s.msgs.push({me: true, txt}); s.st = null; next(); })}); });   // 送信は Enter（右小指）
   };
   next();
 },
 draw(s) {
   const pw = Math.min(380, W * 0.4), ph = GROUND - 20, px = W / 2 - pw / 2, py = 10, size = Math.min(16, STEP * 0.17);
   rrect(px, py, pw, ph, 22); g.fillStyle = '#8aa4c8'; g.fill();
   g.save(); rrect(px, py, pw, ph, 22); g.clip();
   g.fillStyle = '#7b93b8'; g.fillRect(px, py, pw, 46); text('ゆうき', px + pw / 2, py + 23, size, '#fff');
   g.font = `500 ${size}px "Hiragino Sans",sans-serif`;
   let y = py + ph - 64;
   [...s.msgs].reverse().forEach(m => {
     const w = g.measureText(m.txt).width + size * 1.6, h = size * 2.2;
     y -= h + 10;
     const x = m.me ? px + pw - w - 16 : px + 48;
     if (!m.me) dot(px + 26, y + h / 2, 13, '#d9dde3');
     bubble(x, y, w, h, m.me ? '#86d76a' : '#fff', m.me ? 'right' : 'left');
     text(m.txt, x + size * 0.8, y + h / 2, size, '#111', 'left');
   });
   g.fillStyle = '#fff'; g.fillRect(px, py + ph - 52, pw, 52);
   if (s.st) {
     text(s.st.done, px + 18, py + ph - 26, size, '#111', 'left');
     const w1 = g.measureText(s.st.done).width;
     text(s.st.pend, px + 18 + w1, py + ph - 26, size, '#06c755', 'left');
   }
   g.restore();
 }},
{id: 'voice', group: '打鍵', name: '声で打つ', note: '「話す」を押して話すと、その言葉があなたの指で打たれる（かなで認識された部分。漢字だけなら声のリズムで）。「こえ」は声のリズムをそのまま指に返す', use: '声で入力したのに、打ったのは指',
 opts: {mode: ['ことば', 'こえ']},
 actions: [{label: s => s.rec ? '聞いています…' : '話す', run: s => listenVoice(s)}],
 init(s) { s.rec = false; s.env = []; s.peaks = []; s.st = null; s.heard = ''; },
 stop(s) { s.halt?.(); },
 draw(s, t) {
   if (s.heard) text(s.heard, W / 2, GROUND * 0.25, Math.min(STEP * 0.2, 20), DIM);
   drawTyped(s.st, GROUND * 0.45);
   if (!s.env.length) return;
   const t1 = s.env[s.env.length - 1].t || 1, max = Math.max(...s.env.map(e => e.r), 0.02), x0 = W * 0.15, w = W * 0.7, base = GROUND * 0.8;
   g.fillStyle = alpha(FG, 0.5);
   s.env.forEach(e => g.fillRect(x0 + e.t / t1 * w, base - e.r / max * STEP, 2, e.r / max * STEP * 2));
   s.peaks.forEach(p => dot(x0 + p.t / t1 * w, base - STEP * 1.3, 5, t >= p.at ? ACC : DIM));
 }},
{id: 'runaway', group: '打鍵', name: '暴走', note: 'ゆっくり打ち始め、止められない速さまで加速して、ぷつりと止まる', use: '⑥ 暴走',
 opts: {mode: ['でたらめ', 'くりかえし']},
 init(s) {
   const POOL = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん', LOOP = 'とてもよかったです。ほんとうに';
   s.t0 = now(); s.txt = ''; s.prev = -1;
   const step = () => {
     const p = (now() - s.t0) / (12000 / P.spd);
     if (p >= 1) return at(2600, () => { s.t0 = now(); s.txt = ''; step(); });
     const iv = 260 * Math.pow(18 / 260, p);
     let k; do k = ri(8); while (k === s.prev); s.prev = k;
     hit(k);
     s.txt += s.o.mode === 'でたらめ' ? pick(POOL) : LOOP[s.txt.length % LOOP.length];
     at(iv, step);
   };
   step();
 },
 draw(s) {
   const size = Math.min(STEP * 0.24, 24), per = Math.floor(W * 0.8 / size), rows = Math.floor((GROUND - 40) / (size * 1.5));
   const lines = [];
   for (let i = 0; i < s.txt.length; i += per) lines.push(s.txt.slice(i, i + per));
   lines.slice(-rows).forEach((l, j) => text(l, W * 0.1, 30 + j * size * 1.5, size, FG, 'left'));
 }},
{id: 'piano', group: '打鍵', name: '演奏', note: '降ってくる音符が届いた瞬間に、その指が弾く', use: '弾かされる心地よさ（「自分が弾いた」と感じるか）',
 opts: {mel: Object.keys(MELODIES), snd: ['音あり', '音なし']},
 init(s) {
   const run = () => {
     const beat = 60000 / (100 * P.spd);
     let tt = 0;
     s.notes = MELODIES[s.o.mel].map(([k, b]) => { const n = {k, t: tt, d: b * beat}; tt += b * beat; return n; });
     s.t0 = now() + 1800; s.beat = beat;
     s.notes.forEach(n => { if (n.k >= 0) at(s.t0 + n.t - now(), () => { hit(n.k); if (s.o.snd === '音あり') tone(FREQ[n.k], n.d * 0.9, 0.12, 'triangle'); }); });
     at(s.t0 + tt + 1500 - now(), run);
   };
   run();
 },
 draw(s, t) {
   const px = (GROUND - 20) / 1800;
   s.notes.forEach(n => {
     if (n.k < 0) return;
     const y = GROUND - (s.t0 + n.t - t) * px, h = Math.max(6, n.d * px - 6);
     if (y < -h || y - h > GROUND + 40) return;
     const a = y > GROUND ? Math.max(0, 1 - (y - GROUND) / 40) : 1;
     rrect(kx(n.k) - STEP * 0.28, y - h, STEP * 0.56, h, 5); g.fillStyle = alpha(ACC, 0.85 * a); g.fill();
   });
   g.fillStyle = LINE; g.fillRect(kx(0) - STEP * 0.5, GROUND, kx(7) - kx(0) + STEP, 2);
 }},

// 選ぶ
{id: 'whisper', group: '選ぶ', name: 'ささやき', note: '4択のうち1つの指だけが、ときどき押し上げられる（強さで加減）', use: '③ 誘導。さりげない後押し',
 opts: {show: ['隠す', '見せる']},
 init(s) {
   s.target = ri(4); s.since = now(); s.tw = -1e9;
   const tick = () => {
     if (now() - s.since > 12000) { s.target = ri(4); s.since = now(); }
     hit(CARD_KEYS[s.target]); s.tw = now();
     at(rand(1200, 2200) / P.spd, tick);
   };
   at(800, tick);
 },
 draw(s, t) { const y = cards(); if (s.o.show === '見せる') dot(kx(CARD_KEYS[s.target]), y + 16, 4, alpha(ACC, 0.3 + 0.7 * Math.exp(-(t - s.tw) / 200))); }},
{id: 'roulette', group: '選ぶ', name: '先回り', note: 'ルーレットが指の上を回り、止まった指が押される', use: '選んだのは誰？（機械が、あなたの指で決める）',
 opts: {snd: ['音なし', '音あり']},
 init(s) {
   const round = () => {
     let iv = 55, i = ri(4); s.sel = null;
     const stepR = () => {
       i = (i + 1) % 4; s.hl = i;
       hit(CARD_KEYS[i], P.len, P.str * 0.7);
       if (s.o.snd === '音あり') tone(1200, 25, 0.05, 'square');
       iv *= 1.13;
       if (iv < 480) return at(iv / P.spd, stepR);
       at(iv / P.spd, () => { s.sel = i; hit(CARD_KEYS[i]); at(2200 / P.spd, round); });
     };
     stepR();
   };
   round();
 },
 draw(s) { cards(s.hl, s.sel); }},

// 主体感
{id: 'offset', group: '主体感', name: '先か後か', note: '文字が出るのとキーが動くのをずらす（－はキーが先）', use: '「自分が打った」と感じるタイミングを探す',
 opts: {ofs: ['-200', '-100', '-50', '0', '+50', '+100', '+200']}, defaults: {ofs: '0'},
 init(s) {
   s.items = [];
   const go = () => {
     const off = parseInt(s.o.ofs), k = ri(8), ch = pick([...FINGERS[k].replace(/[^a-z;]/g, '')]);
     at(Math.max(0, -off), () => hit(k));
     at(Math.max(0, off), () => s.items.push({ch, k, t: now()}));
     at(1400 / P.spd, go);
   };
   go();
 },
 draw(s, t) {
   s.items = s.items.filter(it => t - it.t < 900);
   s.items.forEach(it => text(it.ch, kx(it.k), GROUND * 0.45, STEP * 0.9, alpha(FG, 1 - (t - it.t) / 900)));
 }},
{id: 'mirror', group: '主体感', name: '鏡の手', note: '画面の手の指と、あなたの指が一緒に動く。ときどき食い違う', use: '画面の手が自分の手になる／ならなくなる瞬間',
 opts: {mode: ['一致', '食い違う']},
 init(s) {
   s.f = new Array(8).fill(-1e9);
   const go = () => {
     const k = ri(8), r = Math.random();
     if (s.o.mode === '一致' || r > 0.3) { hit(k); s.f[k] = now(); }
     else if (r < 0.15) s.f[k] = now();                       // 画面だけ動く
     else { hit(k); s.f[k === 0 ? 1 : k === 7 ? 6 : k + pick([-1, 1])] = now(); }  // 隣の指が動いて見える
     at(rand(180, 420) / P.spd, go);
   };
   go();
 },
 draw(s, t) {
   const top = GROUND * 0.62, L = [0.95, 1.2, 1.35, 1.25, 1.25, 1.35, 1.2, 0.95];
   [[0, 3], [4, 7]].forEach(([a, b]) => { rrect(kx(a) - STEP * 0.45, top, kx(b) - kx(a) + STEP * 0.9, STEP * 0.9, STEP * 0.3); g.fillStyle = '#2a2b30'; g.fill(); });
   for (let i = 0; i < 8; i++) {
     const up = Math.exp(-Math.max(0, t - s.f[i]) / 130), h = STEP * L[i];
     rrect(kx(i) - STEP * 0.24, top - h - up * STEP * 0.35 + STEP * 0.2, STEP * 0.48, h, STEP * 0.24);
     g.fillStyle = up > 0.05 ? alpha(ACC, 0.35 + 0.65 * up) : '#3a3b41'; g.fill();
   }
 }},

// 押す（白いキーを、あなたが押す）
{id: 'mole', group: '押す', name: 'モグラ叩き', input: true, note: '白く上がったキーがモグラ。沈む前に押し込む', use: '自分で押す手応え（このあと奪われるもの）',
 opts: {n: ['1匹', '2匹', '3匹'], snd: ['音あり', '音なし']},
 init(s) {
   s.m = {}; s.fx = [];
   const sync = () => listen(Object.keys(s.m).reduce((a, k) => a | 1 << k, 0));
   s.sync = sync;
   const spawn = () => {
     const free = [0, 1, 2, 3, 4, 5, 6, 7].filter(k => !s.m[k]);
     if (Object.keys(s.m).length < parseInt(s.o.n) && free.length) {
       const k = pick(free), id = now();
       s.m[k] = {t: id}; sync();
       at(300 + 1300 / P.spd, () => { if (s.m[k]?.t === id) { delete s.m[k]; s.fx.push({k, t: now(), hit: false}); sync(); } });
     }
     at(rand(300, 900) / P.spd, spawn);
   };
   spawn();
 },
 press(s, k, t) {
   if (!s.m[k]) return;
   delete s.m[k]; s.fx.push({k, t, hit: true}); s.sync();
   if (s.o.snd === '音あり') tone(880, 120, 0.12, 'triangle');
 },
 draw(s, t) {
   const r = STEP * 0.3;
   Object.entries(s.m).forEach(([k, m]) => {
     const a = Math.min(1, (t - m.t) / 150), x = kx(+k), y = GROUND - 10 - a * STEP * 0.7;
     dot(x, y, r, FG); dot(x - r * 0.35, y - r * 0.15, r * 0.1, '#111'); dot(x + r * 0.35, y - r * 0.15, r * 0.1, '#111');
   });
   s.fx = s.fx.filter(f => t - f.t < 500);
   s.fx.forEach(f => {
     const k = (t - f.t) / 500, x = kx(f.k);
     if (f.hit) { g.strokeStyle = alpha(ACC, 1 - k); g.lineWidth = 3; g.beginPath(); g.arc(x, GROUND - STEP * 0.7, r + k * STEP * 0.6, 0, Math.PI * 2); g.stroke(); }
     else dot(x, GROUND - 10 - (1 - k) * STEP * 0.7, r, alpha(DIM, 1 - k));
   });
 }},
{id: 'lanes', group: '押す', name: '音ゲー', input: true, note: '8列に落ちてきたものが下に届くと、その列のキーが上がる。「自分で押す」では、届く瞬間に白いキーを押す', use: 'リズムに乗せられる／自分で乗る',
 opts: {mode: ['キーが上がる', '自分で押す']},
 init(s) { s.notes = []; s.fx = []; s.next = now() + 600; s.fall = 1600; },
 press(s, k, t) {
   const n = s.notes.find(n => n.k === k && !n.done && Math.abs(n.at - t) <= 220);
   if (n) { n.done = true; s.fx.push({k, t, good: true}); }
 },
 draw(s, t) {
   const self = s.o.mode === '自分で押す';
   if (t >= s.next) {
     const free = [0, 1, 2, 3, 4, 5, 6, 7].filter(k => !s.notes.some(n => n.k === k && n.at > t + s.fall - 600));
     if (free.length) {
       const k = pick(free), n = {k, at: t + s.fall};
       s.notes.push(n);
       if (!self) at(s.fall, () => { hit(k); n.done = true; s.fx.push({k, t: now(), good: false}); });
     }
     s.next = t + rand(250, 650) / P.spd;
   }
   if (self) listen(s.notes.filter(n => !n.done && n.at - t < 500 && t - n.at < 220).reduce((m, n) => m | 1 << n.k, 0));
   s.notes = s.notes.filter(n => !n.done && t - n.at < 220);
   g.strokeStyle = LINE; g.lineWidth = 1;
   for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(kx(i), 0); g.lineTo(kx(i), GROUND); g.stroke(); }
   g.fillStyle = LINE; g.fillRect(kx(0) - STEP * 0.5, GROUND, kx(7) - kx(0) + STEP, 2);
   s.notes.forEach(n => { const y = GROUND - (n.at - t) / s.fall * (GROUND - 10); rrect(kx(n.k) - STEP * 0.3, y - 7, STEP * 0.6, 14, 7); g.fillStyle = self ? FG : ACC; g.fill(); });
   s.fx = s.fx.filter(f => t - f.t < 350);
   s.fx.forEach(f => { const k = (t - f.t) / 350; g.strokeStyle = alpha(f.good ? FG : ACC, 1 - k); g.lineWidth = 3; g.beginPath(); g.ellipse(kx(f.k), GROUND, STEP * (0.3 + k * 0.4), STEP * (0.1 + k * 0.12), 0, 0, Math.PI * 2); g.stroke(); });
 }},
{id: 'chain', group: '押す', name: '波及', input: true, note: '押したキーから、ほかの指へ波が広がる', use: '自分の一押しが、思った以上に広がっていく',
 opts: {keys: ['D F J K', '8本']},
 init(s) { s.rings = []; listen(s.o.keys === '8本' ? 0xFF : 0x3C); },
 press(s, k, t) {
   s.rings.push({o: k, t});
   for (let d = 1; d < 8; d++) [k - d, k + d].forEach(j => { if (j >= 0 && j < 8) at(d * 90 / P.spd, () => hit(j, P.len, P.str * Math.max(0.35, 1 - d / 8))); });
 },
 draw(s, t) {
   s.rings = s.rings.filter(R => t - R.t < 900 / P.spd);
   s.rings.forEach(R => {
     const r = (t - R.t) / (90 / P.spd), a = Math.max(0, 1 - r / 8);
     g.strokeStyle = alpha(ACC, a); g.lineWidth = 2;
     g.beginPath(); g.ellipse(kx(R.o), GROUND, r * STEP + 4, (r * STEP + 4) * 0.35, 0, Math.PI, Math.PI * 2); g.stroke();
   });
 }},
{id: 'echo', group: '押す', name: 'まねっこ', input: true, note: '白いキーで好きなリズムを押す。少し待つと、同じ指で打ち返される', use: '自分の癖が写し取られて、返ってくる',
 opts: {mode: ['そのまま', '少し変える', '速く']},
 init(s) { s.rec = []; s.dots = []; s.play = false; listen(0x3C); },
 press(s, k, t) { if (s.play) return; s.rec.push({k, t}); s.dots.push({k, t, me: true}); },
 draw(s, t) {
   if (!s.play && s.rec.length && t - s.rec[s.rec.length - 1].t > 1300) {
     s.play = true; listen(0);
     let acc = 0, prev = s.rec[0].t;
     s.rec.forEach(r => {
       acc += (r.t - prev) * (s.o.mode === '速く' ? 0.6 : s.o.mode === '少し変える' ? rand(0.8, 1.25) : 1); prev = r.t;
       const k = s.o.mode === '少し変える' && Math.random() < 0.25 ? clamp(r.k + pick([-1, 1]), 2, 5) : r.k;
       at(500 + acc, () => { hit(k); s.dots.push({k, t: now(), me: false}); });
     });
     at(500 + acc + 900, () => { s.rec = []; s.play = false; listen(0x3C); });
   }
   s.dots = s.dots.filter(d => t - d.t < 1600);
   s.dots.forEach(d => { const a = 1 - (t - d.t) / 1600; dot(kx(d.k), GROUND - 30 - (t - d.t) * 0.15, 9, alpha(d.me ? FG : ACC, a)); });
 }},
{id: 'snatch', group: '押す', name: '横取り', input: true, note: '4択を押すと、ときどき別の指が押されて、そちらが選ばれる', use: '選んだつもりが、選ばされている',
 opts: {mode: ['ときどき', 'いつも', 'しない']},
 init(s) { s.sel = null; listen(0x3C); },
 press(s, k) {
   const ci = CARD_KEYS.indexOf(k);
   if (s.sel != null || ci < 0) return;
   listen(0);
   if (Math.random() < {ときどき: 0.35, いつも: 1, しない: 0}[s.o.mode]) {
     const j = pick([0, 1, 2, 3].filter(i => i !== ci));
     hit(CARD_KEYS[j]); s.sel = j; s.mine = false;
   } else { s.sel = ci; s.mine = true; }
   at(2000, () => { s.sel = null; listen(0x3C); });
 },
 draw(s) { cards(null, s.sel, s.mine ? FG : ACC); }},
{id: 'handover', group: '押す', name: '主導権', input: true, note: '白く上がったキーを押して文を打つ。だんだん機械が先に打つようになる', use: 'who typed? の核心：どこまでが自分の入力か',
 opts: {mode: ['だんだん', '半分', '自分だけ']}, text: 'わたしは じぶんで えらんで うっている。',
 init(s) {
   s.m = toMora(s.text); s.seq = [];
   s.m.forEach((m, mi) => { if (!m.keys) s.seq.push({mi, ch: '', f: -1, end: true}); else [...m.keys].forEach((ch, j) => s.seq.push({mi, ch, f: fingerOf(ch), end: j === m.keys.length - 1})); });
   s.i = 0; s.out = []; s.buf = []; s.wait = -1; s.tok = 0;
   const done = who => {
     const e = s.seq[s.i];
     if (e.ch) s.buf.push({ch: e.ch, m: who === 'm'});
     if (e.end) { s.out.push({disp: s.m[e.mi].disp, m: s.buf.some(b => b.m)}); s.buf = []; }
     s.i++; s.wait = -1; s.tok++;
     step();
   };
   s.done = done;
   const step = () => {
     if (s.i >= s.seq.length) { listen(0); return at(3000, () => { s.i = 0; s.out = []; s.buf = []; step(); }); }
     const e = s.seq[s.i];
     if (e.f < 0) return at(120 / P.spd, () => done('-'));
     const prog = s.i / s.seq.length, p = {だんだん: Math.min(1, 1.15 * prog * prog), 半分: 0.5, 自分だけ: 0}[s.o.mode];
     if (Math.random() < p) { listen(0); at(rand(120, 240) / P.spd, () => { hit(e.f); done('m'); }); return; }
     s.wait = e.f; listen(1 << e.f);
     const tok = s.tok;
     at(6000, () => { if (s.tok === tok) { listen(0); hit(e.f); done('m'); } });   // 待っても押されなければ、機械が打つ
   };
   step();
 },
 press(s, k) { if (k === s.wait) s.done('me'); },
 draw(s) {
   const size = Math.min(STEP * 0.42, 44), y = GROUND * 0.45;
   g.font = `500 ${size}px "Hiragino Sans",sans-serif`;
   const parts = [...s.out.map(o => [o.disp, o.m ? ACC : FG]), ...s.buf.map(b => [b.ch, b.m ? ACC : FG])];
   const next = s.wait >= 0 ? s.seq[s.i].ch : '';
   let w = parts.reduce((a, [str]) => a + g.measureText(str).width, 0) + g.measureText(next).width, x = W / 2 - w / 2;
   parts.forEach(([str, c]) => { text(str, x, y, size, c, 'left'); x += g.measureText(str).width; });
   if (next) { text(next, x, y, size, DIM, 'left'); g.fillStyle = FG; g.fillRect(x, y + size * 0.6, g.measureText(next).width, 2); }
 }},

// 手で
{id: 'calib', group: '手で', name: '校正', input: true, note: '押し込みの判定の準備。オートキャリブレーション中はキーに触れない（約25秒）', use: '基板ごとに一度。結果は Pico に保存され、v10 と共有',
 opts: {depth: ['浅く', 'ふつう', '深く']}, defaults: {depth: 'ふつう'},
 onOpt(s, k, v) { send('DEPTH ' + {浅く: 15, ふつう: 30, 深く: 50}[v]); },
 actions: [
   {label: () => 'オートキャリブレーション', run: () => { stopAll(); send('AUTO'); }},
   {label: s => s.check ? '下げる' : '上げて確かめる', run: s => { s.check = !s.check; listen(s.check ? 0xFF : 0); }},
 ],
 init(s) { s.check = false; s.hits = new Array(8).fill(-1e9); send('PROFILE'); const poll = () => { if (s.check) send('SENSE'); at(300, poll); }; poll(); },
 press(s, k, t) { s.hits[k] = t; },
 draw(s, t) {
   for (let i = 0; i < 8; i++) {
     const c = calKeys[i], y = GROUND - STEP * 0.15;
     text(c === 'ok' ? '✓' : c === 'skip' ? '使わない' : '', kx(i), y - STEP * 1.1, STEP * 0.16, c === 'ok' ? FG : DIM);
     if (s.check && sense?.[i]) text(sense[i][0] ? `${sense[i][0]} / ${sense[i][1]}` : '', kx(i), y - STEP * 0.6, STEP * 0.14, DIM);
     const a = Math.exp(-(t - s.hits[i]) / 300);
     if (a > 0.02) dot(kx(i), y - STEP * 0.25, 6, alpha(ACC, a));
   }
 }},
{id: 'manual', group: '手で', name: 'てうち', note: 'PC の asdfjkl; で、そのキーを打つ。Shift で長く', use: '基板と配線の確認／即興で試す',
 init() {}, draw() {}},
];

// ---- 切り替え・操作 ----
let cur = null, s = null, paused = false;
// 声で打つ：マイクの音量の変化（声のリズム）を取りながら、音声認識（Chrome、ja-JP）で言葉を聞く。
// 話し終えて 0.9 秒静かになるか 6 秒たつと止まり、ことば → その文を打つ／こえ → 声の山ごとに1打（左から順に）
async function listenVoice(s) {
  if (s.rec) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch (e) { status('マイクが使えません: ' + e.message, 4000); return; }
  stopAll(); clearTimers();
  Object.assign(s, {rec: true, env: [], peaks: [], st: null, heard: ''}); renderHead();
  const a = audio(), an = a.createAnalyser(); an.fftSize = 1024; a.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize), t0 = now();
  let loudAt = 0, ended = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = SR && s.o.mode === 'ことば' ? new SR() : null;
  const iv = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let r = 0; for (const v of buf) r += v * v; r = Math.sqrt(r / buf.length);
    s.env.push({t: now() - t0, r});
    if (r > 0.02) loudAt = now();
    if ((loudAt && now() - loudAt > 900) || now() - t0 > 6000) halt();
  }, 15);
  let played = false, recDone = !rec;
  const play = () => {
    if (played || cur.id !== 'voice' || paused) return;   // 2回目／話している間に別の体験へ移った
    played = true;
    if (s.o.mode === 'ことば' && toMora(s.heard).some(m => m.keys)) { s.st = typist(s.heard); return; }
    if (s.heard) status('漢字は打てないので、声のリズムで打ちます', 3000);
    const env = s.env.map((e, i, a) => ({t: e.t, r: (a[i - 1]?.r ?? e.r) / 4 + e.r / 2 + (a[i + 1]?.r ?? e.r) / 4}));
    const max = Math.max(...env.map(e => e.r)), thr = Math.max(0.02, 0.25 * max);
    let low = Infinity, last = -1e9;
    env.forEach((e, i) => {
      low = Math.min(low, e.r);
      const isPeak = e.r >= thr && e.r >= (env[i - 1]?.r ?? 0) && e.r > (env[i + 1]?.r ?? 0);
      if (isPeak && e.t - last > 110 && e.r - low >= 0.25 * e.r) { s.peaks.push({t: e.t, r: e.r / max}); last = e.t; low = e.r; }
    });
    const first = s.peaks[0]?.t ?? 0, start = now() + 400;
    s.peaks.forEach((p, j) => { p.at = start + p.t - first; at(p.at - now(), () => hit(j % 8, P.len, P.str * (0.5 + 0.5 * p.r))); });
  };
  const halt = s.halt = () => {
    if (ended) return; ended = true;
    clearInterval(iv); stream.getTracks().forEach(tr => tr.stop());
    s.rec = false; s.halt = null; if (cur === EXPS.find(e => e.id === 'voice')) renderHead();
    if (recDone) play(); else try { rec.stop(); } catch (e) { recDone = true; play(); }   // 認識の終わり（onend）で打つ
  };
  if (rec) {
    // 認識は話し終えると自分で終わる。結果が届いたら録音も止め、終わったら打つ
    rec.lang = 'ja-JP'; rec.interimResults = false;
    rec.maxAlternatives = 5;   // 候補のうち、かなで打てる文字がいちばん多いもの（「今日は」より「こんにちは」）
    rec.onresult = e => {
      const alts = [...e.results[0]].map(a => a.transcript);
      const typable = str => toMora(str).filter(m => m.keys).length;
      s.heard = alts.reduce((best, a) => typable(a) > typable(best) ? a : best, alts[0]);
      halt();
    };
    rec.onerror = e => status('音声認識: ' + e.error, 4000);
    rec.onend = () => { recDone = true; if (ended) play(); else halt(); };
    rec.start();
  }
}
const optMemory = {}, textMemory = {};
function select(id) {
  cur?.stop?.(s);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  stopAll(); clearTimers();
  cur = EXPS.find(e => e.id === id) || EXPS[0];
  const o = optMemory[cur.id] ||= Object.fromEntries(Object.entries(cur.opts || {}).map(([k, v]) => [k, cur.defaults?.[k] ?? v[0]]));
  s = {o, text: textMemory[cur.id] ?? cur.text};
  if (!paused) cur.init(s);
  history.replaceState(null, '', '#' + cur.id);
  renderHead();
}
function renderHead() {
  $('name').textContent = cur.name; $('note').textContent = cur.note; $('use').textContent = cur.use;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === cur.id));
  const box = $('opts'); box.innerHTML = '';
  Object.entries(cur.opts || {}).forEach(([k, vals]) => {
    const seg = document.createElement('div'); seg.className = 'seg';
    vals.forEach(v => { const b = document.createElement('button'); b.textContent = v; b.className = s.o[k] === v ? 'on' : ''; b.onclick = () => { s.o[k] = v; cur.onOpt?.(s, k, v); select(cur.id); }; seg.append(b); });
    box.append(seg);
  });
  if (cur.actions) {
    const seg = document.createElement('div'); seg.className = 'seg';
    cur.actions.forEach(a => { const b = document.createElement('button'); b.textContent = a.label(s); b.onclick = () => { a.run(s); renderHead(); }; seg.append(b); });
    box.append(seg);
  }
  if (cur.text != null) {
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = s.text;
    inp.onchange = () => { textMemory[cur.id] = inp.value; select(cur.id); };
    box.append(inp);
  }
}
function setPaused(p) {
  paused = p; $('status').textContent = p ? '一時停止中' : '';
  if (p) { stopAll(); clearTimers(); paused = true; } else select(cur.id);
}
let lastGroup = '';
EXPS.forEach(e => {
  if (e.group !== lastGroup) { const h = document.createElement('h2'); h.textContent = lastGroup = e.group; $('list').append(h); }
  const b = document.createElement('button'); b.textContent = e.name; b.dataset.id = e.id; b.onclick = () => select(e.id); $('list').append(b);
});
['spd', 'str', 'len'].forEach(id => {
  const inp = $(id), out = inp.nextElementSibling, fmt = {spd: v => v.toFixed(2) + '×', str: v => v + '%', len: v => v + 'ms'}[id];
  try { const v = localStorage.getItem('keycap-lab-' + id); if (v != null) inp.value = v; } catch (e) {}
  const upd = () => { P[id] = +inp.value; out.textContent = fmt(P[id]); try { localStorage.setItem('keycap-lab-' + id, inp.value); } catch (e) {} };
  inp.oninput = upd; upd();
});
addEventListener('pointerdown', () => audio(), {once: true});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); return; }
  if (e.key === 'Escape') { stopAll(); clearTimers(); setPaused(true); return; }
  const k = 'asdfjkl;'.indexOf(e.key.toLowerCase()), k2 = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon'].indexOf(e.code);
  const i = k2 >= 0 ? k2 : k;
  if (i < 0 || e.repeat) return;
  if (cur.input) firePress(i);
  else { const was = paused; paused = false; hit(i, e.shiftKey ? 600 : P.len); paused = was; }
});
addEventListener('keyup', e => {
  const i = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon'].indexOf(e.code);
  if (i >= 0 && cur.input) fireRelease(i);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) setPaused(true); });
addEventListener('resize', layout);

// ---- ループ ----
let prev = now();
function loop() {
  const t = now(), dt = Math.min(50, t - prev); prev = t;
  g.clearRect(0, 0, W, H);
  if (!paused) cur.draw(s, t, dt);
  drawKeys(t, dt);
  requestAnimationFrame(loop);
}
layout(); connUI();
select(location.hash.slice(1) || 'dot');
requestAnimationFrame(loop);
</script>
