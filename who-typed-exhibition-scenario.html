<style>
:root{--ink:#18212b;--muted:#68727d;--line:#dfe4e8;--blue:#1769aa;--soft:#f4f6f8;--red:#b3261e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:#e9edf1}
body{padding:20px}.shell{width:min(1180px,97vw);margin:auto}.terminal{background:#fff;border:1px solid #cfd6dc;border-radius:14px;box-shadow:0 22px 65px #24354620;overflow:hidden}
.top{height:54px;background:#f5f6f7;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:13px}.mark{font-weight:800;letter-spacing:.08em}.progress{margin-left:auto;font-size:12px;color:var(--muted)}
.stage{min-height:680px;display:grid;place-items:center;padding:54px}.card{width:min(860px,100%)}.eyebrow{font-size:12px;letter-spacing:.15em;color:#7d8791;margin-bottom:18px}.card h1{font-size:32px;line-height:1.45;margin:0 0 18px}.lead{font-size:17px;line-height:1.9;color:#4e5964}.notice{margin-top:28px;color:var(--muted);font-size:14px}
.choices{display:flex;gap:12px;margin-top:32px}.choice{flex:1 1 0;min-width:0;border:1px solid #cfd6dc;border-radius:10px;padding:20px 8px 16px;background:white;font-size:16px;text-align:center}.choice kbd{display:block;width:fit-content;margin:12px auto 0;background:#eef1f4;padding:3px 8px;border-radius:4px;color:#56616c}.choice.selected{background:#e9f2fa;border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}
.field{border:1.5px solid #b9c2ca;border-radius:10px;min-height:205px;padding:20px;font-size:18px;line-height:1.9;white-space:pre-wrap;background:#fff}.field.short{min-height:76px}.field.mid{min-height:130px}.field.focus{border-color:#68a0ce;box-shadow:0 0 0 4px #1769aa12}.cursor{display:inline-block;width:2px;height:1em;background:#222;vertical-align:-2px;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.comp{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:6px;text-decoration-color:#4e5964}
.action{margin-top:22px;display:flex;justify-content:flex-end}.primary{border:0;border-radius:8px;background:#1f2933;color:#fff;padding:12px 22px;font-weight:700}.primary.pressed{transform:translateY(2px);filter:brightness(.75)}
.response{padding:34px;border-left:5px solid var(--blue);background:#f5f9fc;font-size:19px;line-height:1.9}.stars{display:flex;gap:14px;margin:32px 0}.star{border:1px solid #cfd6dc;background:#fff;border-radius:10px;width:105px;padding:18px;text-align:center;font-size:28px;color:#d49a00}.star small{display:block;color:#68727d;font-size:12px;margin-top:7px}.star.selected{background:#fff7df;border-color:#d49a00;box-shadow:0 0 0 3px #d49a0018}
.thread{border:1px solid var(--line);border-radius:14px;padding:20px 24px 16px;max-width:640px;margin:18px auto 0;background:#fff}.tw{display:grid;grid-template-columns:42px 1fr;gap:12px;position:relative}.tw+.tw{margin-top:18px}.tw:not(:last-child)::before{content:'';position:absolute;left:20px;top:50px;bottom:-14px;width:2px;background:var(--line)}.avatar{width:42px;height:42px;background:#202b36;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800}.tw-head{display:flex;align-items:center;gap:6px;font-size:15px}.handle{color:var(--muted);font-size:13px}.tw-head .xm{margin-left:auto;width:18px;height:18px}.xm svg,.xmark svg{width:100%;height:100%;fill:currentColor;display:block}.post-text{font-size:16px;line-height:1.75;white-space:pre-wrap;margin-top:4px}.photo{width:100%;height:190px;object-fit:cover;background:#d9dee2;border-radius:12px;margin-top:12px;border:1px solid var(--line)}.stage:has(.compact){padding:28px 54px 120px}.card.compact h1{font-size:26px;margin-bottom:4px}.card.compact .eyebrow{margin-bottom:10px}
.xmark{width:132px;height:132px;margin:0 auto 34px;color:#000}
.qr{width:220px;height:220px;image-rendering:pixelated;border:10px solid #fff;box-shadow:0 2px 15px #0002;margin:24px auto;display:block}.center{text-align:center}.final-link{color:var(--blue);font-size:14px;word-break:break-all}
.operator{margin-top:13px;border-radius:11px;background:#161a20;color:#eef2f5;overflow:hidden}.operator summary{padding:13px 17px;cursor:pointer;color:#bbc3cc;font-size:13px}.ops{border-top:1px solid #30363e;padding:15px;display:grid;gap:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.op{border:1px solid #424a54;background:#242a31;color:white;border-radius:7px;padding:9px 12px}.op:disabled{opacity:.45}.status{font-size:12px;color:#aeb6bf}.tests{display:flex;gap:7px;flex-wrap:wrap}.tests button{border:1px solid #424a54;background:#242a31;color:#d8dde3;border-radius:6px;padding:7px 9px}.danger{color:#ffb4ab}.hidden{display:none!important}
.keyrow{display:grid;grid-template-columns:repeat(4,1fr) 34px repeat(4,1fr);gap:10px;margin-top:32px}.keyrow .slot{border:1.5px dashed #e3e7ea;border-radius:10px;min-height:78px}.keyrow .choice,.keyrow .star{width:auto;min-width:0;min-height:78px;margin:0;padding:16px 4px;display:grid;place-content:center;text-align:center}.keyrow .star small{margin-top:4px}.hands{display:grid;grid-template-columns:1fr 34px 1fr;gap:10px;margin-top:8px;font-size:12px;color:#9aa3ab;text-align:center}
.fm{display:flex;gap:3px;justify-content:center;margin:12px auto 0}.fm i{width:9px;height:14px;border-radius:2px;background:#dde2e6}.fm i.on{background:#1f2933}.fm b{width:9px}.choice.selected .fm i.on,.star.selected .fm i.on{background:var(--blue)}
.primary .fm{display:inline-flex;margin:0 0 0 12px;vertical-align:-1px;gap:2px}.primary .fm i{width:6px;height:11px;background:#4a5560}.primary .fm i.on{background:#fff}.primary .fm b{width:6px}
.hand{display:flex;gap:10px;justify-content:center;margin:34px 0 8px}.hand .gap{width:44px}.cap{width:64px;height:64px;font-size:14px!important;border:1px solid #cfd6dc;border-radius:10px;display:grid;place-content:center;text-align:center;font-weight:700;font-size:18px;color:#56616c;background:#fff;transition:background .06s,color .06s}.cap small{display:block;font-size:10px;font-weight:400;color:#8a949e;margin-top:2px}.cap.hint{border:2px solid #1f2933}.cap.on{background:#1f2933;border-color:#1f2933;color:#fff}.cap.on small{color:#c9d0d6}
.terms{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:16px 18px;font-size:14px;line-height:1.8;color:#4e5964;margin:6px 0 18px}
.ops select{background:#242a31;color:#eef2f5;border:1px solid #424a54;border-radius:6px;padding:6px 8px}
/* 送信中のローディングと、謝罪のイラスト */
.spinner{width:58px;height:58px;border:6px solid #e3e8ec;border-top-color:var(--blue);border-radius:50%;margin:0 auto 30px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.reply{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:center}.bow{width:250px}.bow .upper{transform-box:view-box;transform-origin:110px 120px;animation:bow 1.4s .5s ease-in-out forwards}@keyframes bow{to{transform:rotate(-52deg)}}.bow .lines{opacity:0;animation:fade .4s 1.9s forwards}@keyframes fade{to{opacity:1}}
/* ボタン位置を全画面で固定：「次へ」系は右下、「決定」「掲載を許可する」は中央下 */
.stage{position:relative;padding-bottom:140px}.action{position:absolute;bottom:46px;right:54px;margin:0!important}.action.center{right:auto;left:50%;transform:translateX(-50%)}
/* 改行：文節の切れ目（phraseBreakで入れた位置）でだけ折り返す。入りきらない塊だけは例外的にどこでも折る */
.stage{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}.card h1,.lead,.response,.terms{text-wrap:pretty}
/* 投稿中に表示する正面写真 */
.posting{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:center}.face{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}.face.show{opacity:1;transform:none}.face img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;background:#d9dee2}.face small{display:block;margin-top:8px;font-size:14px;color:var(--muted);text-align:right}
/* 文字を大きく見やすく */
.top{height:62px}.mark{font-size:18px}#sceneLabel{font-size:17px}.progress{font-size:15px}
.card{width:min(980px,100%)}.eyebrow{font-size:24px;font-weight:700;letter-spacing:.08em;color:#56616c}.card h1{font-size:40px}.lead{font-size:22px}.notice{font-size:18px}
.field{font-size:26px;line-height:1.75}.field.short{min-height:92px}.field.mid{min-height:150px}
.primary{font-size:20px;padding:14px 26px}.response{font-size:24px;line-height:1.85}
.keyrow .slot,.keyrow .choice,.keyrow .star{min-height:100px}.keyrow .choice{font-size:clamp(15px,1.9vw,22px);white-space:nowrap}.star{font-size:36px}.star small{font-size:17px}.hands{font-size:24px;font-weight:700;color:#7d8791;margin-top:12px}
.terms{font-size:19px}.cap{width:80px;height:80px;font-size:18px!important}.cap small{font-size:13px}
.tw-head{font-size:17px}.handle{font-size:15px}.post-text{font-size:19px}.card.compact h1{font-size:32px}.final-link{font-size:18px}
@media(max-width:800px){.stage{padding:30px 20px 130px}.action{right:20px}.posting{grid-template-columns:1fr 200px;gap:20px}.choices{flex-wrap:wrap}.choice{flex-basis:30%}}
/* 暴走する長文の入力欄：下端に追従して流れる */
.field.long{min-height:360px;max-height:420px;overflow:hidden;font-size:22px;line-height:1.7}
.thread.scroll{max-height:400px;overflow:hidden}
/* レッスン（②〜⑤）：語学アプリ風のゲーム画面。ルール説明 → 問題 → 正解のフィードバック */
.duo{font-family:"Nunito","M PLUS Rounded 1c",-apple-system,"Hiragino Maru Gothic ProN",sans-serif;color:#4b4b4b}
.stage:has(.duo){padding:26px 40px 30px}
.duo h1,.card .duo h1{font-size:36px;font-weight:800;color:#3c3c3c;margin:0;line-height:1.35}
.duo-top{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.duo-prog{flex:1;height:18px;border-radius:10px;background:#e5e5e5;overflow:hidden}.duo-prog i{display:block;height:100%;width:0;background:#58cc02;border-radius:10px;box-shadow:inset 0 4px 0 #ffffff40;transition:width .7s cubic-bezier(.3,1.4,.6,1)}
.duo-stat{display:flex;gap:18px;font-weight:900;font-size:22px;align-items:center}.hearts i{font-style:normal;color:#ff4b4b;margin-left:2px}.hearts i.lost{color:#e5e5e5}.hearts.shake{animation:shake .4s}
.xp{color:#ffc800}.xp b{color:#4b4b4b;margin-left:4px}.xp.bump b{display:inline-block;animation:pop .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:none}}
.duo-main{display:grid;grid-template-columns:1fr;gap:18px}
.duo-ask{display:flex;align-items:flex-end;gap:14px;margin-bottom:10px}.mascot{width:76px;height:76px;flex:none}
.bubble{position:relative;border:2px solid #e5e5e5;border-radius:16px;padding:14px 18px;font-size:22px;font-weight:800;background:#fff}.bubble::before{content:'';position:absolute;left:-10px;bottom:20px;width:16px;height:16px;background:#fff;border-left:2px solid #e5e5e5;border-bottom:2px solid #e5e5e5;transform:rotate(45deg)}
.duo-answer{min-height:70px;padding:4px 0;display:flex;flex-wrap:wrap;gap:8px 10px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 64px,#e5e5e5 64px 66px)}
.tile{display:inline-flex;align-items:center;gap:8px;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:14px;background:#fff;padding:8px 16px;font:inherit;font-size:24px;font-weight:700;color:#4b4b4b;line-height:1.3;min-height:56px}
.tile.in{animation:pop .25s}.tile.blank{width:130px;border-style:dashed;background:#f7f7f7}
.tile.ghost{color:#afafaf;border-style:dashed;background:#fafafa}.tile.ghost em{font-style:normal;font-family:"Nunito",sans-serif;font-size:14px;font-weight:900;color:#fff;background:#1cb0f6;border-radius:7px;padding:2px 7px}
.duo-bank{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.duo-bank.off .tile{opacity:.3}
.tile.opt{flex-direction:column;justify-content:center;min-height:100px;text-align:center;font-size:22px;gap:10px}.tile.opt.rec{border-color:#84d8ff;border-style:dashed}.tile.opt.wrong{border-color:#ff4b4b;background:#ffdfe0;color:#ea2b2b;animation:shake .4s}.tile.opt.selected{border:3px solid #1cb0f6;background:#ddf4ff;color:#1899d6;box-shadow:0 0 0 6px #1cb0f640;animation:pick .3s}.tile.opt.selected .kc{background:#1cb0f6;border-color:#1899d6;color:#fff}.tile.opt.selected .kc small{color:#e6f7ff}
.kc{display:inline-flex;flex-direction:column;align-items:center;min-width:48px;padding:4px 9px 3px;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:10px;background:#fff;font:900 17px/1.1 "Nunito",sans-serif;color:#4b4b4b}.kc small{font:700 11px/1.2 "M PLUS Rounded 1c",sans-serif;color:#afafaf;margin-top:2px}
.doc-label{font-size:15px;font-weight:800;color:#afafaf;margin-bottom:8px;letter-spacing:.06em}
.duo .field.doc{min-height:340px;max-height:340px;overflow:hidden;font-size:24px;line-height:1.75;padding:16px 18px;border:2px solid #e5e5e5;border-radius:16px;background:#fffdf5;box-shadow:none}
.duo-foot{margin-top:20px;border-top:2px solid #e5e5e5;padding:16px 20px;display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:center;transition:background .2s}
.foot-msg b{display:block;font-size:24px;font-weight:800;color:#3c3c3c}.foot-msg span{font-size:17px;font-weight:700;color:#777}
.duo-timer{height:16px;border-radius:9px;background:#e5e5e5;overflow:hidden}.duo-timer i{display:block;height:100%;width:0;background:#1cb0f6;border-radius:9px}
.duo-foot.ok,.duo-foot.warn,.duo-foot.bad{border-radius:16px;border-top-color:transparent}.duo-foot.ok{background:#d7ffb8}.duo-foot.ok b{color:#58a700}.duo-foot.warn{background:#fff4d1}.duo-foot.warn b{color:#cd7900}.duo-foot.bad{background:#ffdfe0}.duo-foot.bad b{color:#ea2b2b}
.intro-head{display:flex;align-items:center;gap:24px;margin:4px 0 24px}.intro-head .mascot{width:118px;height:118px}
.lesson-no{display:inline-block;background:#58cc02;color:#fff;font-weight:900;font-size:18px;border-radius:10px;padding:4px 12px;margin-bottom:8px}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:12px}.rules li{display:grid;grid-template-columns:250px 1fr;align-items:center;gap:20px;border:2px solid #e5e5e5;border-radius:16px;padding:12px 18px;font-size:21px;font-weight:700;position:relative}
.rules li.new{border-color:#1cb0f6;background:#f1fbff}.rules li.new::after{content:'NEW';position:absolute;top:-11px;right:16px;background:#1cb0f6;color:#fff;font:900 13px/1 "Nunito",sans-serif;padding:4px 8px;border-radius:7px}
.rules b{color:#1899d6}.rk{display:flex;gap:8px;justify-content:center;align-items:center}.ri{font-size:36px;line-height:1}
.intro .duo-foot{grid-template-columns:1fr auto}.duo-btn{display:inline-block;background:#58cc02;color:#fff;font-weight:900;font-size:20px;letter-spacing:.06em;border-radius:14px;padding:14px 36px;box-shadow:0 4px 0 #58a700}
.icon kbd{display:block;margin:0 auto;font:700 18px/1 ui-monospace,monospace;color:#7d8791}
.keyrow .icon{font-size:52px;display:grid;place-content:center;gap:6px;min-height:120px}.icon{transition:transform .15s,box-shadow .15s}.icon.selected{border:3px solid #1cb0f6;background:#ddf4ff;box-shadow:0 0 0 8px #1cb0f640;transform:scale(1.1);animation:pick .35s}.icon.selected kbd{background:#1cb0f6;color:#fff}
.keyrow:has(.icon.selected) .icon:not(.selected){opacity:.35}
@keyframes pick{0%{transform:scale(.92)}60%{transform:scale(1.16)}100%{transform:scale(1.1)}}.great{font-size:56px;font-weight:800;color:var(--blue);margin-top:26px;min-height:70px}
/* 問いかけ：投稿を見せながら「誰が書いたのか」を問う */
.ask{display:grid;grid-template-columns:1fr 560px;gap:44px;align-items:center}.ask .who{font-size:52px;line-height:1.45;margin:0;letter-spacing:.04em}.ask .thread{margin:0;max-height:520px}
@media(max-width:1000px){.ask{grid-template-columns:1fr}}
/* ボタンを押した瞬間のハイライト */
.primary.pressed{background:var(--blue);filter:none;transform:translateY(2px);box-shadow:0 0 0 7px #1769aa40}
/* 展示アンケート（Xに投稿する側）は配色を変えて、前半のアンケートの繰り返しに見せない */
.terminal.x{background:#0f1419;border-color:#2f3336}.terminal.x .top{background:#16181c;border-color:#2f3336;color:#e7e9ea}.terminal.x .stage{color:#e7e9ea}

.terminal.x .field{background:#16181c;border-color:#3a3f45;color:#e7e9ea}.terminal.x .field.focus{border-color:#1d9bf0;box-shadow:0 0 0 4px #1d9bf033}
.terminal.x .choice,.terminal.x .star{background:#16181c;border-color:#3a3f45;color:#e7e9ea}.terminal.x .keyrow .slot{border-color:#2f3336}
.terminal.x .primary{background:#eff3f4;color:#0f1419}.terminal.x .primary .fm i{background:#9aa4ad}.terminal.x .primary .fm i.on{background:#0f1419}.terminal.x .primary.pressed{background:#1d9bf0;color:#fff;box-shadow:0 0 0 7px #1d9bf055}
.terminal.x .thread{background:#000;border-color:#2f3336}.terminal.x .tw:not(:last-child)::before{background:#2f3336}.terminal.x .avatar{background:#2f3336}.terminal.x .photo{background:#16181c;border-color:#2f3336}

.end{display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:center;text-align:left}.end .qr{margin:0 auto 14px;width:200px;height:200px}.end .thread{margin:0}

/* 画面サイズを固定：1180×782 の画面を、ウィンドウに収まるよう拡大縮小する（fitScreen）。フェーズで大きさが変わらず、スクロールしない */
.shell{width:1180px}
.stage{height:720px;min-height:0;overflow:hidden;padding:36px 54px 110px}

.duo .field.doc{flex:1;min-height:0;max-height:none}
.duo-foot{margin-top:12px}

.duo-ask{align-items:center;gap:10px;margin-bottom:6px}.duo-ask .mascot{width:44px;height:44px}
.bubble{font-size:16px;font-weight:700;color:#8a8f94;padding:7px 14px;border-width:1.5px;border-radius:12px}.bubble::before{width:10px;height:10px;left:-6px;bottom:auto;top:calc(50% - 5px);border-width:1.5px}

.duo-bank{grid-template-columns:.55fr 1.15fr 1.15fr 1.15fr 26px 1fr 1fr 1fr 1fr;gap:10px} /* 左右の手を同じ幅にして、4＋4の間を画面の真ん中に */
.duo-bank .tile.opt{font-size:20px;padding:8px 10px}
.slot8{border:2px dashed #e5e5e5;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:100px;opacity:.55}

.slot8.act{border-style:solid;opacity:1}.slot8.act .kc{color:#4b4b4b}.slot8.act small{color:#777}
.hands8{display:grid;grid-template-columns:1fr 26px 1fr;gap:10px;margin-top:6px;font-size:16px;font-weight:800;color:#afafaf;text-align:center}
.icon.wrong{border:3px solid #ff4b4b;background:#ffdfe0;animation:shake .4s}.great .ng{color:#ea2b2b;font-size:40px}
/* 文の枠：最後の言葉まで枠を出し、今えらんでいる枠を強調する */
.tile.cur{border-color:#1cb0f6;box-shadow:0 0 0 4px #1cb0f633}.tile.blank.cur{background:#f1fbff;border-color:#1cb0f6;animation:curBlink 1.2s ease-in-out infinite}
.tile.blank.later{width:110px;opacity:.6}
@keyframes curBlink{50%{box-shadow:0 0 0 8px #1cb0f622}}
.duo-top .count{font:900 22px/1 "Nunito",sans-serif;color:#afafaf;min-width:64px;text-align:right}
.rules li{font-size:26px}
.duo-bank.long .tile.opt{font-size:17px;line-height:1.4;padding:8px 6px;gap:8px}.duo-bank.long .tile.opt span{word-break:normal;overflow-wrap:normal;line-break:strict}
/* 制限時間：右上の円。指示文は出さないので、下の欄はフィードバックだけ */
.ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6}.ring circle:first-child{stroke:#e5e5e5}
.ring #bar{stroke:#1cb0f6;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1}
.duo-foot{grid-template-columns:1fr;min-height:84px}
/* 制限時間の円は、解答欄の右端（3択のすぐ上）に大きく置き、選択肢を見ていても視界に入るようにする */
.answer-row{display:flex;align-items:center;gap:20px}.answer-row .duo-answer{flex:1}
.answer-row .ring{width:96px;height:96px}.ring circle{stroke-width:5}
.duo-top{justify-content:flex-end;margin-bottom:0}
/* 8つのキーの外枠は黒の線（①の箱と、レッスンの4＋4） */
.duo-bank .tile.opt,.duo-bank .slot8,.keyrow .icon{border:2px solid #222;border-bottom-width:4px}
.duo-bank .slot8{opacity:1}.duo-bank .slot8:not(.act) .kc{opacity:.45}
.duo-bank .tile.opt.selected,.keyrow .icon.selected{border:3px solid #1cb0f6}.duo-bank .tile.opt.wrong,.keyrow .icon.wrong{border:3px solid #ff4b4b}

function phraseBreak(text){if(!SEG||!text)return text;const parts=[...SEG.segment(text.replace(/\u200b/g,''))].map(x=>x.segment);let out='';
 for(let i=0;i<parts.length;i++){const w=parts[i],prev=out.slice(-1),next=parts[i+1]||'';

async function rampage(f,src){const R=CONFIG.rampage;let stop=false,n=0;
 (async()=>{while(!stop){const now=performance.now(),ready=FINGERS.filter(x=>(fingerReady.get(x)||0)<=now);
  if(ready.length){const x=pick(ready),[h,fi]=x.split('-');fingerReady.set(x,now+CONFIG.fingerRecoverMs);pulseMotor(h,fi);if(Math.random()<.5)sound('key')}
  await sleep(R.motorMs)}})().catch(()=>{});
 const tick=()=>sleep(Math.max(R.minMs,R.startMs*Math.exp(-(n++)/R.accelChars)));
 try{const segs=parse(src);
  for(let si=0;si<segs.length;si++){const seg=segs[si];let kana='';
   for(const ch of seg.reading){await tick();kana+=ch;f.render(f.pending+kana)}
   f.pending+=seg.surface;if(/[。！？]$/.test(seg.surface)){f.committed+=f.pending;f.pending=''}f.render(f.pending);
   if(seg.draftEnd){let d=0;for(let k=si;k>=0&&segs[k].draft;k--)d+=segs[k].surface.length;await sleep(250);for(let k=0;k<d;k++){await tick();f.pending=f.pending.slice(0,-1);f.render(f.pending)}}}
  f.committed+=f.pending;f.pending='';f.render('')}
 finally{stop=true}}
async function eraseTail(f,n){for(let i=0;i<n;i++){await stroke('Backspace',()=>{f.committed=f.committed.slice(0,-1);f.render('')});await sleep(rand(45,75))}DOC.text=f.committed}
// 3択の窓。制限時間（choiceMs）が来るまで次へ進まない。時間内は何度でもえらび直せて、Delete で取り消せる。
// opts は先頭が正解（表示はシャッフル）。不正解はその場で×になる。tab: Tab で候補（正解）をえらべる（mark なら正解のタイルを点線で示す）。
// back: 何もえらんでいないときの Delete で1つ前に戻る。show(sel): えらんだ状態に合わせて解答欄を描く
// 戻り値 'tab' | 'pick'（自分で正解をえらんだ）| 'back' | null（時間切れ）
async function chooseWindow(opts,{tab=false,mark=false,back=false,ms=CONFIG.choiceMs,say=['',''],show=()=>{}}={}){
 const order=[0,1,2].sort(()=>Math.random()-.5),ans=order.indexOf(0),T=ms;
 setOpts(order.map(i=>opts[i]),tab&&mark?ans:-1,tab);
 let sel=null,used=0,autoDone=false;
 const paint=()=>{$('opts').querySelectorAll('.tile.opt').forEach((el,i)=>el.classList.toggle('selected',i===ans&&(sel==='pick'||(sel==='tab'&&mark))));show(sel)};
 paint();foot('',...say);
 while(used<T){
  const k=await pressed([...OPT_KEYS,...(tab?['Tab']:[]),'Backspace'],{ms:T-used,bar:$('bar'),barFrom:used,barTotal:T,auto:autoDone?null:()=>({delay:rand(700,2000),key:tab&&Math.random()<.6?'Tab':OPT_KEYS[Math.random()<.2?(ans+1)%3:ans]})});
  autoDone=true;used+=pressed.elapsed;
  if(k===null)break;
  if(k==='Backspace'){if(sel!==null){sel=null;paint();foot('',...say);tone([440],{len:.08,gain:.1})}else if(back)return 'back';continue}
  const i=k==='Tab'?ans:OPT_KEYS.indexOf(k);
  if(i!==ans){sel=null;paint();await wrongCard(i);used+=600;foot('',...say);continue}
  sel=k==='Tab'?'tab':'pick';paint();tone([660],{len:.08,gain:.12});foot()}
 return sel}

// 時間切れは正解が入る
async function pickPhrases(phrases,{rec=false,prefix=[]}={}){
 const chosen=[];
 for(let i=0;i<phrases.length;i++){const o=phrases[i];
  const r=await chooseWindow(o,{tab:rec,back:i>0,
   show:sel=>renderSlots([...prefix,...chosen],{word:sel?o[0]:null,ghost:rec?plain(o[0]):''},phrases.length-i-1)});
  if(r==='back'){chosen.pop();i-=2;continue}
  if(r===null)await timeUp('正解が入りました');
  chosen.push(o[0])}
 renderSent([...prefix,...chosen]);return chosen}

// ④⑤ 続きの補完。うすい字の候補は普通の文（faithful）なのに、Tab を押すと解答欄には違う文（typed）が入る。
// 制限時間（sentenceMs）が来るまでは Delete で消して、3択（文ごと：正解 faithful と、意味が通らない wrong 2つ）から自分でえらべる。
// 時間が来た時点の選択で決まる：Tab なら typed、自分でえらべば faithful。何もえらばなければ、キーボードが勝手に Tab を押す。戻り値 {src, manual}
async function completeRest(start,{faithful,typed,wrong}){
 const r=await chooseWindow([faithful,...wrong],{tab:true,ms:CONFIG.sentenceMs,
  show:sel=>renderSlots([start],{word:sel==='tab'?typed:sel==='pick'?faithful:null,ghost:plain(faithful)},0)});
 if(r===null){foot('warn','時間切れ','自動で補完します');await stroke('Tab');renderSlots([start],{word:typed},0);await sleep(800)} // 時間切れは、キーボードが勝手に決める
 renderSent([]);$('opts').classList.add('off');
 return r==='pick'?{src:start+'/'+faithful,manual:true}:{src:start+'/'+typed,manual:false}}

function cancelAll(){for(const x of waits){clearTimeout(x.timer);x.reject(CANCEL)}waits.clear();for(const x of [...cancelers])x.reject();cancelers.clear();fingerReady.clear();releaseAll()}
async function play(from){idle=false;const g=++gen;cancelAll();if(!sessionId)sessionId=(crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));running=true;paused=false;pauseBtn.textContent='一時停止';pauseBtn.disabled=false;seekEl.disabled=false;document.activeElement?.blur?.();$('startBtn').disabled=true;hardwareUI();playStatus.textContent='再生中';audio();try{await run(from)}catch(e){if(e!==CANCEL){console.error(e);playStatus.textContent='エラー: '+e.message}}finally{if(g===gen){running=false;pauseBtn.disabled=true;seekEl.disabled=false;releaseAll();hardwareUI()}}}
function start(){if(running)return;if(!$('realConsent').checked&&$('publicSession').checked){playStatus.textContent='公開する場合は、実際の同意確認が必要です';return}publishAllowed=true;sessionId='';return play(0)}
// シークバー：指定のシーンの頭から再生し直す（同じセッションのまま。投稿は同じセッションIDで重複送信されない）
seekEl.oninput=()=>{const n=+seekEl.value;seekLabel.textContent=n+' / '+TOTAL+' '+(SCENE_NAMES[n]||'')};
seekEl.onchange=()=>{const n=+seekEl.value;if(!running&&!$('realConsent').checked&&$('publicSession').checked){playStatus.textContent='公開する場合は、実際の同意確認が必要です';seekEl.value=0;return}if(!running&&!sessionId)publishAllowed=true;play(n)};
const SCENE_NAMES=['スタート','① えらぶ','② レッスン1（自分で選ぶ）','③ レッスン2（Tab補完）','④ レッスン3（小さな食い違い）','⑤ レッスン4（大きな食い違い）','⑥ 暴走','⑧ ツイート確認','公開中','問いかけ','終了'];
$('startBtn').onclick=start;$('stopPublish').onclick=()=>{publishAllowed=false;postAbort?.abort('stop');$('publicSession').checked=false;$('stopPublish').textContent='公開中止済み';$('stopPublish').disabled=true};

// CFI-8MOTOR-DC-v3 — reference-compatible Web Serial interface.
const MOTOR={'left-pinky':9,'left-ring':10,'left-middle':11,'left-index':12,'right-index':5,'right-middle':6,'right-ring':7,'right-pinky':8};
const hb=$('hwConnectBtn'),hs=$('hwStatus'),grid=$('hwTestGrid');let port=null,writer=null,heartbeat=null,seq=0,queue=Promise.resolve(),disconnecting=false;const active=new Set(),motorTimers=new Map(),testButtons=[];
function packet(mask,n){return new Uint8Array([0xA5,n&255,mask&255,(mask>>8)&255,(n&255)^(mask&255)^((mask>>8)&255)])}
function sendMask(){if(!writer)return Promise.resolve();let mask=0;active.forEach(n=>mask|=1<<(n-1));const bytes=packet(mask,seq++),target=writer;queue=queue.then(()=>target.write(bytes)).catch(e=>{if(!disconnecting){setPaused(true);disconnectHardware('通信エラー: '+e.message)}});return queue}
function releaseAll(){motorTimers.forEach(clearTimeout);motorTimers.clear();active.clear();return sendMask()}
function hardwareUI(message){hb.textContent=writer?'ソレノイド基板を切断':'ソレノイド基板に接続';hs.textContent=message||(writer?'接続中（Motor 5〜12 / 150ms）':'未接続（Motor 5〜12）');testButtons.forEach(b=>b.disabled=!writer||running)}
function pulseNumber(n,duration=150){if(!writer||paused)return;clearTimeout(motorTimers.get(n));active.add(n);sendMask();motorTimers.set(n,setTimeout(()=>{motorTimers.delete(n);active.delete(n);sendMask()},duration))}
function pulseMotor(h,f){const n=MOTOR[h+'-'+f];if(n)pulseNumber(n)}
async function disconnectHardware(message){if(disconnecting)return;disconnecting=true;hb.disabled=true;clearInterval(heartbeat);heartbeat=null;await releaseAll();const w=writer,p=port;writer=null;port=null;try{w?.releaseLock()}catch{}try{await p?.close()}catch{}disconnecting=false;hb.disabled=false;hardwareUI(message)}
if(!('serial'in navigator)){hb.disabled=true;hs.textContent='Web Serial非対応です。Chrome / Edgeで開いてください。'}else{
 for(const [n,label] of [[9,'A / 左小指'],[10,'S / 左薬指'],[11,'D / 左中指'],[12,'F / 左人差指'],[5,'J / 右人差指'],[6,'K / 右中指'],[7,'L / 右薬指'],[8,'; / 右小指']]){const b=document.createElement('button');b.textContent=label+' (M'+n+')';b.disabled=true;b.onclick=()=>{if(!running)pulseNumber(n,400)};grid.appendChild(b);testButtons.push(b)}
 hb.onclick=async()=>{if(writer){setPaused(true);await disconnectHardware();return}hb.disabled=true;try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});writer=port.writable.getWriter();seq=0;queue=Promise.resolve();active.clear();await sendMask();heartbeat=setInterval(sendMask,100);hardwareUI()}catch(e){await disconnectHardware('接続できませんでした: '+e.message)}finally{hb.disabled=false}};
 navigator.serial.addEventListener('disconnect',e=>{if(port&&(e.target===port||e.port===port)){setPaused(true);disconnectHardware('基板の接続が外れました。')}})
}
// 待機画面：どれかのキーを押すと体験が始まる（ホスト用パネルの「体験を開始」でも始められる）
show(0,'スタート',`<div class="eyebrow">体験をはじめます</div><h1>キーボードの上に、<br>両手の指を置いてください。</h1><p class="lead" id="startLead">準備ができたら、どれかのキーを押してください。</p>`);hardwareUI();
let idle=true,startedByKey=false;
document.addEventListener('keydown',e=>{if(!idle||running||e.repeat||e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName))return;
 e.preventDefault();if(!$('realConsent').checked&&$('publicSession').checked){$('startLead').textContent='スタッフをお呼びください。';playStatus.textContent='公開する場合は、実際の同意確認が必要です（確認後、キーで開始できます）';return}
 startedByKey=true;start()});
// 体験画面（ヘッダー＋ステージ＝1180×782）がウィンドウに収まる倍率にする
function fitScreen(){document.querySelector('.shell').style.zoom=Math.min((innerWidth-40)/1180,(innerHeight-40)/782)}
addEventListener('resize',fitScreen);fitScreen();
// リハーサル用：?scene=N で、公開せず自動操作で、そのシーンから始める（例: ?scene=4）
{const q=new URLSearchParams(location.search);if(q.has('scene')){$('autoDemo').checked=q.get('auto')!=='0';$('publicSession').checked=false;play(+q.get('scene')||0)}}
})();
</script>
