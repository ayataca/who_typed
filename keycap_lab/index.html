<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycap Lab</title>
<base href="/keycap_lab/"><!-- トップ（http://localhost:8787）で開いても、post.js・dialogue.js を keycap_lab から読む -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--panel:#141518;--fg:#e8e6e1;--dim:#7d7a74;--line:#26272b;--acc:#9ecbff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
body{display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
/* シナリオの画面：16:9 より横長にはしない（横長のウィンドウでは、左右を空ける） */
#frame{position:relative;justify-self:center;height:100%;min-height:0;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
/* 下の帯：細かい設定。全画面のときは隠れて、シナリオの画面だけになる（Esc で戻る） */
#bar{display:flex;flex-direction:column;gap:6px;padding:8px 16px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim)}
html.fs #bar{display:none}
.row{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
#opts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--fg)}
.op{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.op:disabled{opacity:.45;cursor:default}
#conn.live{border-color:var(--acc);color:var(--acc)}
#conn.warn{border-color:#e5484d;color:#e5484d}
#bar label{display:flex;gap:6px;align-items:center}
#bar input[type=range]{width:110px;accent-color:var(--acc)}
#bar output{width:44px;color:var(--fg)}
#pv-hands{width:96px;aspect-ratio:16/9;background:#000;border-radius:4px;object-fit:cover}
#postResult a{color:#9ecbff}
#keys{margin-left:auto}
#status{color:var(--acc)}
#inputState.warn{color:#e5484d}

/* ===== 投稿のあとの画面（本編 who-typed-exhibition-scenario.html と同じ組み方。X の部分は白地。post.js） ===== */
#post{position:absolute;left:0;top:0;display:none;overflow:hidden;background:#fff;
  --ink:#2b3445;--ink-2:#5b6270;--gray:#c7c9cc;--rule:#e1e2e4;--paper:#fff;--text:#1a2330;
  --x-ink:#0f1419;--x-sub:#536471;--x-line:#cfd9de;--x-panel:#f7f9f9;--x-blue:#1d9bf0}
#post.on{display:block}
#post .terminal{position:absolute;left:50%;top:50%;width:1180px;height:720px;transform-origin:50% 50%}
#post .stage{width:1180px;height:720px;display:grid;place-items:center;padding:36px 54px 110px;position:relative;overflow:hidden;background:var(--paper);color:var(--text);
  font-family:"Poppins","Noto Sans JP",-apple-system,"Hiragino Sans",sans-serif;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
#post .stage:has(.compact){padding:24px 54px 100px}
#post .card{width:min(980px,100%)}
#post .card:has(.ask){width:100%}
#post .eyebrow{font:500 20px/1.6 "Noto Sans JP",sans-serif;color:var(--ink-2);letter-spacing:.04em;margin-bottom:18px}
#post .card h1{font:700 40px/1.45 "Noto Sans JP",sans-serif;letter-spacing:.03em;margin:0 0 18px;text-wrap:pretty}
#post .card.compact h1{font-size:32px;margin-bottom:4px}
#post .card.compact .eyebrow{margin-bottom:10px}
#post .lead{font-size:22px;line-height:1.9;color:#4e5964;text-wrap:pretty}
#post .center{text-align:center}
#post .thread{border:1px solid var(--x-line);border-radius:16px;padding:16px 18px 6px;max-width:640px;margin:18px auto 0;background:#fff;color:var(--x-ink)}
#post .thread.scroll{max-height:400px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 26px,#000 calc(100% - 56px),transparent)}
#post .tw{display:grid;grid-template-columns:42px 1fr;gap:12px;position:relative}
#post .tw+.tw{margin-top:18px}
#post .tw:not(:last-child)::before{content:'';position:absolute;left:20px;top:50px;bottom:-14px;width:2px;background:var(--x-line)}
#post .avatar{width:42px;height:42px;background:#0f1419;color:#fff;border-radius:50%;display:grid;place-items:center;font-family:"Poppins",sans-serif;font-weight:600}
#post .tw-head{display:flex;align-items:center;gap:6px;font-size:17px}
#post .handle,#post .tw .when{color:var(--x-sub);font-size:15px}
#post .tw-head .xm{margin-left:auto;width:18px;height:18px;color:var(--x-ink)}
#post .xm svg{width:100%;height:100%;fill:currentColor;display:block}
#post .post-text{font-size:19px;line-height:1.75;white-space:pre-wrap;margin-top:4px}
#post .photo{width:100%;height:190px;object-fit:cover;background:var(--x-panel);border-radius:16px;margin-top:12px;border:1px solid var(--x-line)}
#post .tw-act{display:flex;justify-content:space-between;max-width:420px;margin:10px 0 4px;color:var(--x-sub);font-size:14px}
#post .tw-act span{display:inline-flex;align-items:center;gap:6px}
#post .tw-act svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#post .action{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);margin:0}
#post .primary{border:0;border-radius:999px;background:#0f1419;color:#fff;padding:14px 34px;font:700 20px/1.2 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#post .primary.pressed{background:var(--x-blue);transform:translateY(2px);box-shadow:0 0 0 7px #1d9bf040}
#post .spinner{width:58px;height:58px;border:6px solid var(--x-line);border-top-color:var(--x-blue);border-radius:50%;margin:0 auto 30px;animation:kp-spin .9s linear infinite}
@keyframes kp-spin{to{transform:rotate(360deg)}}
#post .ask{display:grid;grid-template-columns:1fr 470px;gap:40px;align-items:stretch}
#post .ask-l{position:relative;display:flex;flex-direction:column;justify-content:center}
#post .ask .who{font:700 56px/1.45 "Noto Sans JP",sans-serif;letter-spacing:.04em;margin:0;color:var(--ink)}
#post .ask .rule{width:120px;height:1px;background:var(--gray);margin:0 0 26px}
#post .ask .thread{margin:0;max-height:560px;align-self:center}
#post .thanks .qr{width:210px;height:210px;margin:0 auto 12px;display:block;image-rendering:pixelated;box-shadow:0 0 0 1px var(--rule)}
#post .thanks .final-link{font:500 15px/1 "Poppins",sans-serif;color:var(--ink-2);word-break:break-all}
#post .thanks .rule{width:120px;height:1px;background:var(--gray);margin:30px auto 26px}
#post .thanks h1{font-size:44px;margin:0 0 16px}
#post .thanks .lead{font-size:19px;color:var(--ink-2);line-height:1.9}
</style>
</head>
<body>
<div id="frame"><canvas id="cv"></canvas><div id="post"></div></div>
<footer id="bar">
  <div class="row">
    <div id="opts"></div>
    <button class="op" id="fsBtn">全画面で表示</button>
    <button class="op" id="conn"></button>
    <span id="status"></span>
    <span>入力テスト</span><div class="seg" id="inputSeg"></div><span id="inputState"></span>
    <span id="keys">Enter はじめる　Space 一時停止　H 表示の切り替え　Esc 全画面をやめる</span>
  </div>
  <div class="row">
    <label>速さ <input id="spd" type="range" min="0.25" max="3" step="0.05" value="1"><output></output></label>
    <label>強さ <input id="str" type="range" min="5" max="100" step="1" value="100"><output></output></label>
    <label>駆動時間 <input id="len" type="range" min="30" max="400" step="5" value="150"><output></output></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="realConsent" checked> 撮影・公開について本人の実際の同意を確認済み</label>
    <label><input type="checkbox" id="publicSession" checked> 公開セッション</label>
    <button class="op" id="stopPublish">このセッションの公開を中止</button>
    <button class="op" id="cameraBtn">カメラを開始</button><video id="pv-hands" muted playsinline></video>
    <span id="xStatus">X投稿: 確認中…</span><button class="op" id="deletePost" disabled>直前の投稿をXから削除</button>
    <span id="postResult"></span>
  </div>
</footer>
<script src="post.js"></script>
<script src="dialogue.js"></script>
<script>
'use strict';
// ---- 基本 ----
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = n => Math.floor(Math.random() * n);
const pick = a => a[ri(a.length)];
const now = () => performance.now();
const P = {spd: 1, str: 100, len: 150};   // 速さ（倍）・強さ（PWM %）・駆動時間（ms。キーが立ち上がるのに要る長さ。どの打鍵もこれより短くしない）

// ---- 基板（Web Serial） ----
// P key ms duty kick hz … 1本を ms だけ動かす ／ U mask … 入力：そのキーを上げて押し込みを待つ（200ms ごとに送り直す）／ X … 全部止める
const enc = new TextEncoder();
let port = null, writer = null, reader = null, version = '';
function send(line) { if (writer) writer.write(enc.encode(line + '\n')).catch(() => {}); }
async function openPort(p) {
  port = p;
  await port.open({baudRate: 115200});
  writer = port.writable.getWriter();
  readLoop(port);
  send('V');
  connUI();
}
async function readLoop(p) {
  const dec = new TextDecoder();
  let buf = '';
  reader = p.readable.getReader();
  try {
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
    }
  } catch (e) {} finally { reader.releaseLock(); }
}
function onLine(l) {
  let m;
  if ((m = l.match(/^(?:VERSION|READY) ([A-Z].*)$/))) version = m[1];
  else if ((m = l.match(/^REST (\d)/))) sim[+m[1]].rest = true;
  else if ((m = l.match(/^AWAKE (\d)/))) sim[+m[1]].rest = false;
  else if ((m = l.match(/^RAISED ([0-9A-F]+)/i))) { INPUT.raised = parseInt(m[1], 16); INPUT.armed &= INPUT.raised; inputUI(); }
  else if ((m = l.match(/^ARMED (\d)/))) { INPUT.armed |= 1 << m[1]; inputUI(); }
  else if ((m = l.match(/^DOWN (\d)/))) boardDown(+m[1]);
  else if ((m = l.match(/^UP (\d)/))) { if (INPUT.raised & 1 << m[1]) INPUT.armed &= ~(1 << m[1]); inputUI(); }
  else if (/^TIMEOUT/.test(l)) { INPUT.raised = INPUT.armed = 0; inputUI(); }
  connUI();
}
let statusTimer = 0;
function status(msg, ms = 0) {
  clearTimeout(statusTimer);
  $('status').textContent = msg;
  if (ms) statusTimer = setTimeout(() => $('status').textContent = paused ? '一時停止中' : '', ms);
}
async function closePort() {
  try { await writer.write(enc.encode('X\n')); writer.releaseLock(); await reader.cancel(); await port.close(); } catch (e) {}
  port = writer = reader = null; version = '';
  INPUT.raised = INPUT.armed = 0;
  connUI(); inputUI();
}
function connUI() {
  const b = $('conn');
  b.className = 'op';
  if (!('serial' in navigator)) { b.textContent = 'Chrome で開いてください'; b.disabled = true; return; }
  if (!writer) { b.textContent = '基板に接続'; return; }
  if (version && !/KEYCAP-LAB-v[2-9]/.test(version)) { b.textContent = `${version}（keycap_lab.ino を書き込む）`; b.className = 'op warn'; return; }
  b.textContent = version ? '接続中' : '接続中…';
  b.className = 'op live';
}
$('conn').onclick = async () => {
  if (writer) return closePort();
  try { await openPort(await navigator.serial.requestPort()); } catch (e) { port = writer = null; connUI(); }
};
if ('serial' in navigator) {
  navigator.serial.getPorts().then(ps => { if (ps.length === 1 && !port) openPort(ps[0]).catch(() => { port = writer = null; connUI(); }); });
  navigator.serial.addEventListener('disconnect', e => { if (e.target === port) { port = writer = reader = null; version = ''; connUI(); } });
}

// ---- 出力（基板と、画面のキーの両方へ） ----
const sim = Array.from({length: 8}, () => ({active: false, start: 0, until: 0, duty: 0, kick: 0, hz: 0, lift: 0, rest: false}));
const lastHit = new Array(8).fill(-1e9);
function hit(k, ms = P.len, duty = P.str, kick = 0, hz = 0) {
  if (paused || k < 0 || k > 7) return;
  ms = Math.round(clamp(Math.max(ms, P.len), 1, 5000)); duty = Math.round(clamp(duty, 0, 100));
  if (hz) hz = Math.min(hz, 500 / P.len);   // ふるえも、1回のオンが駆動時間より短くならない
  send(`P ${k} ${ms} ${duty} ${kick | 0} ${hz | 0}`);
  const t = now();
  Object.assign(sim[k], {active: true, start: t, until: t + ms, duty, kick, hz});
  lastHit[k] = t;
}
function stopAll() { send('X'); sim.forEach(s => s.active = false); INPUT.mask = INPUT.raised = INPUT.armed = 0; inputUI(); }
function simLevel(k, t) {
  const s = sim[k];
  if (!s.active || t > s.until) return 0;
  if (s.hz && t - s.start > s.kick && Math.floor((t - s.start - s.kick) / (500 / s.hz)) % 2) return 0;
  return 0.35 + 0.65 * s.duty / 100;
}

// ---- 入力（INPUT）：キーを上げて、来場者が押し込んだキーを受け取る ----
// listen('sdf')（または listen(0b1110)）で、そのキーを上げて待つ。listen(0) で下げる。8本のどれでも選べる（A=0 S=1 D=2 F=3 J=4 K=5 L=6 ;=7）
// ページは 200ms ごとに U を送り直し、途切れると基板は 0.5 秒で全部下げる。
// 押し込みは、基板が USB キーボードとして打つ（a s d f j k l ;）ので、keydown（キーの位置 e.code）で受け取る。基板がなくても、PC のキーボードで試せる。
// 体験は onPress(s, key) で受け取る（上げているキーだけ。自動のリピートは無視）。window の 'kc-press' イベントでも受け取れる。
// シリアルの DOWN は、表示と「キー入力が届いていない」の診断にだけ使う（入力の判定には使わない）
const KEY_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon'];
const KEY_NAMES = ['A', 'S', 'D', 'F', 'J', 'K', 'L', ';'];
const INPUT = {mask: 0, raised: 0, armed: 0, last: '', typed: new Array(8).fill(-1e9), warn: ''};
function toMask(keys) {
  if (typeof keys === 'number') return keys & 0xFF;
  let m = 0;
  for (const c of String(keys || '').toLowerCase()) { const i = 'asdfjkl;'.indexOf(c); if (i >= 0) m |= 1 << i; }
  return m;
}
const maskNames = m => KEY_NAMES.filter((_, i) => m & 1 << i).join(' ') || 'なし';
function listen(keys) {
  const m = toMask(keys);
  if (m !== INPUT.mask) { INPUT.mask = m; INPUT.armed &= m; INPUT.warn = ''; }
  send(`U ${m.toString(16)}`);
  inputUI();
}
setInterval(() => { if (INPUT.mask && !paused) send(`U ${INPUT.mask.toString(16)}`); }, 200);   // 心拍
addEventListener('keydown', e => {
  const k = KEY_CODES.indexOf(e.code);
  if (k < 0 || e.metaKey || e.ctrlKey || e.altKey || !(INPUT.mask & 1 << k)) return;
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  e.preventDefault();
  if (e.repeat) return;
  INPUT.typed[k] = now(); INPUT.last = KEY_NAMES[k]; INPUT.warn = '';
  inputUI();
  cur?.onPress?.(s, k);
  dispatchEvent(new CustomEvent('kc-press', {detail: {key: k, name: KEY_NAMES[k]}}));
});
// 基板が押し込みを読んだのに、0.5 秒たってもキー入力が来ないとき（ページが前面にない・USB Stack が違う・HID 0）
function boardDown(k) {
  INPUT.armed &= ~(1 << k); inputUI();
  const t = now();
  setTimeout(() => {
    if (INPUT.typed[k] >= t - 500) return;
    INPUT.warn = `${KEY_NAMES[k]} の押し込みが、キー入力として届いていません（このページを前面に／USB Stack は Pico SDK）`;
    inputUI();
  }, 500);
}
const INPUT_TESTS = [['なし', 0], ['S D F', toMask('sdf')], ['8本', 0xFF]];
function inputUI() {
  const seg = $('inputSeg'), st = $('inputState');
  if (!seg) return;
  if (!seg.childElementCount) INPUT_TESTS.forEach(([label, m]) => {
    const b = document.createElement('button'); b.textContent = label; b.onclick = () => { b.blur(); listen(m); }; seg.append(b);
  });
  [...seg.children].forEach((b, i) => b.className = INPUT_TESTS[i][1] === INPUT.mask ? 'on' : '');
  const old = version && !/KEYCAP-LAB-v([3-9]|\d\d)/.test(version);
  st.className = INPUT.warn || (INPUT.mask && old) ? 'warn' : '';
  st.textContent = !INPUT.mask ? '' : INPUT.warn ? INPUT.warn
    : old ? `基板が ${version} です。入力には keycap_lab.ino（KEYCAP-LAB-v3）を書き込んでください`
    : `上げる: ${maskNames(INPUT.mask)}　${writer ? `上がっている: ${maskNames(INPUT.raised)}　押せる: ${maskNames(INPUT.armed)}` : '基板なし（PC のキーボードで試せます）'}${INPUT.last ? `　最後: ${INPUT.last}` : ''}`;
}
window.KC_INPUT = {listen, get mask() { return INPUT.mask; }, KEY_NAMES};

// ---- 時間 ----
const timers = new Set();
function at(ms, fn) { const id = setTimeout(() => { timers.delete(id); fn(); }, Math.max(0, ms)); timers.add(id); }
function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

// ---- 音 ----
let AC = null;
function audio() { if (!AC) AC = new AudioContext(); if (AC.state === 'suspended') AC.resume(); return AC; }

// ---- 画面の配置（画面のキーと実物のキーを同じ並びにする） ----
const cv = $('cv'), g = cv.getContext('2d');
let W = 0, H = 0, STEP = 0, KY = 0;
const KX = [];
function layout() {
  const fr = $('frame'), fs = !!document.fullscreenElement;
  document.documentElement.classList.toggle('fs', fs);
  fr.style.width = Math.min(innerWidth, fr.clientHeight * 16 / 9) + 'px';   // 16:9 より横長にしない
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  STEP = Math.min(W / 10.5, H * 0.13, 120);
  for (let i = 0; i < 8; i++) KX[i] = W / 2 + (i - 3.5) * STEP + (i < 4 ? -1 : 1) * STEP * 0.3;
  KY = H - STEP * 0.7;
}
const kx = i => KX[i];

// ---- 画面のキー（白く光るのは、機械が押し上げているキー） ----
const ACC = '#e6e8eb';   // 押し上げられたキーの色（白に近い灰）
function alpha(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function drawKeys(t, dt) {
  const ks = STEP * 0.74;
  for (let i = 0; i < 8; i++) {
    const s = sim[i], push = simLevel(i, t);
    s.lift += (push - s.lift) * Math.min(1, dt / 30);
    const y = KY - s.lift * ks * 0.25;
    g.beginPath(); g.roundRect(kx(i) - ks / 2, y - ks / 2 + 4, ks, ks, ks * 0.16); g.fillStyle = '#08090a'; g.fill();
    g.beginPath(); g.roundRect(kx(i) - ks / 2, y - ks / 2, ks, ks, ks * 0.16);
    g.fillStyle = '#1d1e22'; g.fill();
    if (s.lift > 0.02) { g.fillStyle = alpha(ACC, s.lift * 0.85); g.fill(); }
    g.strokeStyle = s.rest ? '#e5484d' : '#34353a'; g.lineWidth = 1.5; g.stroke();
  }
}

// ---- 文字 → 指（ホームポジションで打つときの指） ----
const FINGERS = ['qaz1!`', 'wsx2"', 'edc3#', 'rfvtgb45$%', 'yhnujm67&\'', 'ik,8(<', 'ol.9)>', 'p;/0-^@[]:?_=+~|{}'];
const fingerOf = ch => ch ? FINGERS.findIndex(s => s.includes(ch)) : -1;
const ROMA = {};
[['あいうえお', ['a', 'i', 'u', 'e', 'o']], ['かきくけこ', 'k'], ['さしすせそ', 's'], ['たちつてと', 't'], ['なにぬねの', 'n'],
 ['はひふへほ', 'h'], ['まみむめも', 'm'], ['やゆよ', ['ya', 'yu', 'yo']], ['らりるれろ', 'r'], ['わをん', ['wa', 'wo', 'nn']],
 ['がぎぐげご', 'g'], ['ざじずぜぞ', 'z'], ['だぢづでど', 'd'], ['ばびぶべぼ', 'b'], ['ぱぴぷぺぽ', 'p'],
 ['ぁぃぅぇぉ', 'l'], ['ゃゅょ', ['lya', 'lyu', 'lyo']]
].forEach(([ks, c]) => [...ks].forEach((ch, i) => ROMA[ch] = Array.isArray(c) ? c[i] : c + 'aiueo'[i]));
Object.assign(ROMA, {'ー': '-', '、': ',', '。': '.', '？': '?', '！': '!'});
function toMora(str) {
  const h = [...str].map(ch => { const c = ch.charCodeAt(0); return c >= 0x30A1 && c <= 0x30F6 ? String.fromCharCode(c - 0x60) : ch; });
  const out = [];
  for (let i = 0; i < h.length; i++) {
    const ch = h[i], nx = h[i + 1];
    if (ch === ' ' || ch === '　') { out.push({disp: ch, keys: '', space: true}); continue; }
    if (ch === 'っ') { const n = ROMA[nx] || ''; out.push({disp: ch, keys: /^[bcdfghjkmprstwz]/.test(n) ? n[0] : 'xtu'}); continue; }
    let r = ROMA[ch];
    if (r && r.length > 1 && r.endsWith('i') && 'ゃゅょ'.includes(nx || '×')) { out.push({disp: ch + nx, keys: r.slice(0, -1) + 'y' + ROMA[nx].slice(-1)}); i++; continue; }
    if (r) out.push({disp: ch, keys: r});
    else if (/[a-z0-9.,;\/\-!?]/i.test(ch)) out.push({disp: ch, keys: ch.toLowerCase()});
    else out.push({disp: ch, keys: ''});   // 漢字など：キーは打たずに出す
  }
  out.forEach((m, i) => { if (m.disp === 'ん' && /^[bcdfghjkmprstvwxz]/.test(out[i + 1]?.keys || '')) m.keys = 'n'; });
  return out;
}

// ---- 人らしい打鍵（who-typed-exhibition-scenario.html の CONFIG.rhythm と interKey と同じ） ----
const RHYTHM = {min: 65, max: 82, altHand: 0.82, sameHand: 1.0, rowJump: 1.15, sameFinger: 1.55, sameKey: 1.25, inMora: 0.9, moraStart: 1.12,
  hesitationChance: 0.04, hesitation: [140, 320], jitter: 0.15};
const ROWS = ['qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];
const rowOf = ch => { const r = ROWS.findIndex(x => x.includes(ch)); return r < 0 ? 1 : r; };
function interKey(a, b, moraStart) {
  let t = rand(RHYTHM.min, RHYTHM.max);
  const fa = fingerOf(a), fb = fingerOf(b);
  if (fa >= 0 && fb >= 0) {
    if (a === b) t *= RHYTHM.sameKey;
    else if ((fa < 4) !== (fb < 4)) t *= RHYTHM.altHand;
    else if (fa === fb) t *= RHYTHM.sameFinger;
    else { t *= RHYTHM.sameHand; if (Math.abs(rowOf(a) - rowOf(b)) === 2) t *= RHYTHM.rowJump; }
  }
  t *= moraStart ? RHYTHM.moraStart : RHYTHM.inMora;
  t *= 1 + (Math.random() * 2 - 1) * RHYTHM.jitter;
  if (moraStart && Math.random() < RHYTHM.hesitationChance) t += rand(...RHYTHM.hesitation);
  return t;
}

// ---- 体験（声の対話。dialogue.js） ----
// init(s) で始め、draw(s, t, dt) を毎フレーム呼ぶ。s.o は右上の選択肢。at() の予約は切り替えで消える
const EXP = window.KC_DIALOGUE;
let cur = null, s = null, paused = false;
const optMemory = {};
function select() {
  cur?.stop?.(s);
  stopAll(); clearTimers();
  cur = EXP;
  const o = optMemory[cur.id] ||= Object.fromEntries(Object.entries(cur.opts || {}).map(([k, v]) => [k, v[0]]));
  s = {o};
  if (!paused) cur.init(s);
  renderHead();
}
function renderHead() {
  const box = $('opts'); box.innerHTML = '';
  Object.entries(cur.opts || {}).forEach(([k, vals]) => {
    const seg = document.createElement('div'); seg.className = 'seg';
    vals.forEach(v => { const b = document.createElement('button'); b.textContent = v; b.className = s.o[k] === v ? 'on' : ''; b.onclick = () => { s.o[k] = v; select(); }; seg.append(b); });
    box.append(seg);
  });
  if (cur.actions) {
    const seg = document.createElement('div'); seg.className = 'seg';
    cur.actions.forEach(a => { const b = document.createElement('button'); b.textContent = a.label(s); b.onclick = () => { a.run(s); renderHead(); }; seg.append(b); });
    box.append(seg);
  }
}
function setPaused(p) {
  paused = p; $('status').textContent = p ? '一時停止中' : '';
  if (p) { stopAll(); clearTimers(); } else select();
}
['spd', 'str', 'len'].forEach(id => {
  const inp = $(id), out = inp.nextElementSibling, fmt = {spd: v => v.toFixed(2) + '×', str: v => v + '%', len: v => v + 'ms'}[id];
  try { const v = localStorage.getItem('keycap-lab-' + id); if (v != null) inp.value = v; } catch (e) {}
  const upd = () => { P[id] = +inp.value; out.textContent = fmt(P[id]); try { localStorage.setItem('keycap-lab-' + id, inp.value); } catch (e) {} };
  inp.oninput = upd; upd();
});
addEventListener('pointerdown', () => audio(), {once: true});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
});
// 全画面：シナリオの画面だけを画面いっぱいに出す（下の帯は隠れる。Esc で戻る）
$('fsBtn').onclick = () => { $('fsBtn').blur(); document.documentElement.requestFullscreen?.().catch(e => status('全画面にできません: ' + e.message, 4000)); };
document.addEventListener('fullscreenchange', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) setPaused(true); });
addEventListener('resize', layout);
new ResizeObserver(layout).observe($('bar'));   // 下の帯の高さが変わったとき（投稿の結果の行が出たときなど）も、画面を合わせ直す

// ---- ループ ----
let prev = now();
function loop() {
  const t = now(), dt = Math.min(50, t - prev); prev = t;
  g.clearRect(0, 0, W, H);
  if (!paused) cur.draw(s, t, dt);
  drawKeys(t, dt);
  requestAnimationFrame(loop);
}
layout(); connUI(); inputUI();
select();
requestAnimationFrame(loop);
</script>
