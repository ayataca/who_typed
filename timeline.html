<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Typed? 感想タイムライン</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b10;color:#eee;font-family:system-ui,"Hiragino Sans",sans-serif}
body{display:flex;flex-direction:column}
header{padding:3vh 4vw 2vh;border-bottom:1px solid #333;display:flex;align-items:center;gap:4vw;flex:none}
header h1{margin:0;font-size:clamp(20px,4.2vw,56px);line-height:1.2}
header p{margin:.4em 0 0;color:#9aa;font-size:clamp(12px,1.9vw,26px)}
#qr{margin-left:auto;text-align:center;font-size:clamp(10px,1.5vw,20px);color:#9aa;flex:none}
#qr svg,#qr img{display:block;width:min(22vw,220px);height:auto;background:#fff;padding:6px;border-radius:6px;margin-bottom:.4em}
.m #qr{display:none}
main{flex:1;overflow-y:auto;padding:2vh 4vw;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.post{border:1px solid #2a2a35;border-radius:12px;padding:1.4vh 2vw;margin-bottom:2vh;background:#14141c;animation:in .6s ease}
.post .meta{color:#789;font-size:clamp(11px,1.5vw,20px);margin-bottom:.4em}
.post .body{font-size:clamp(14px,2.3vw,32px);line-height:1.6;white-space:pre-wrap;word-break:break-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.post.new{border-color:#e33}
.empty{color:#789;text-align:center;margin-top:20vh;font-size:clamp(14px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div><h1>みんなの感想</h1><p>この展示で「勝手に」打たれた感想です</p></div>
  <div id="qr"><div id="qrbox"></div>スマホで読み取る</div>
</header>
<main id="list"><div class="empty">まだ感想はありません</div></main>
<script src="/qrcode.js"></script>
<script>
const isPhone=new URLSearchParams(location.search).has('m');
if(isPhone)document.body.classList.add('m');
const list=document.getElementById('list');
let known=new Set(),first=true,qrUrl='';
function drawQr(url){
  if(qrUrl===url||isPhone)return;qrUrl=url;
  const q=qrcode(0,'M');q.addData(url+'?m=1');q.make();
  document.getElementById('qrbox').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
}
function fmt(at){const d=new Date(at);return isNaN(d)?'':d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
async function refresh(){
  try{
    const r=await fetch('/api/timeline',{cache:'no-store'});const j=await r.json();
    drawQr(j.url);
    if(!j.items.length){list.replaceChildren();known=new Set();return}
    const frag=document.createDocumentFragment();
    for(const it of j.items){
      const el=document.createElement('div');el.className='post'+(!first&&!known.has(it.id)?' new':'');
      const meta=document.createElement('div');meta.className='meta';meta.textContent=fmt(it.at)+(it.rating?' ★'.repeat(0)+'':'' );
      const body=document.createElement('div');body.className='body';body.textContent=it.text;
      el.append(meta,body);frag.append(el);
    }
    const keep=list.scrollTop;
    list.replaceChildren(frag);list.scrollTop=keep;
    known=new Set(j.items.map(i=>i.id));first=false;
  }catch{}
}
refresh();setInterval(refresh,5000);
// 縦型ディスプレイ用：ゆっくり自動スクロールして、端まで来たら戻る
if(!isPhone){let dir=1;setInterval(()=>{if(list.scrollHeight<=list.clientHeight)return;list.scrollTop+=dir;if(list.scrollTop+list.clientHeight>=list.scrollHeight-1)dir=-1;else if(list.scrollTop<=0)dir=1},40)}
</script>
</body>
</html>
