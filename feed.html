<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Who Typed? フィード</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #000000;
    --bg-bar: rgba(0, 0, 0, 0.72);
    --text: #e7e9ea;
    --sub: #71767b;
    --border: #2f3336;
    --link: #1d9bf0;
    --media-bg: #16181c;
    --thread: #333639;
    --banner: #333639;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --bg-bar: rgba(255, 255, 255, 0.85);
    --text: #0f1419;
    --sub: #536471;
    --border: #eff3f4;
    --link: #1d9bf0;
    --media-bg: #f7f9f9;
    --thread: #cfd9de;
    --banner: #cfd9de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.3125;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation; /* ダブルタップで拡大しない */
    cursor: none;
  }
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    max-width: 600px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  @media (max-width: 600px) { #viewport { border: 0; } }
  #track {
    position: absolute;
    left: 0; right: 0; top: 0;
    will-change: transform;
    transition: opacity 0.6s ease;
  }
  #track.fade { opacity: 0; }

  /* 上部バー */
  #topbar {
    position: absolute;
    left: 0; right: 0; top: 0;
    z-index: 5;
    padding: calc(env(safe-area-inset-top) + 6px) 16px 6px;
    background: var(--bg-bar);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 24px;
    min-height: 53px;
  }
  #topbar .back { width: 20px; height: 20px; flex: none; fill: var(--text); }
  #topbar .t-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
  #topbar .t-count { color: var(--sub); font-size: 13px; }

  /* プロフィール */
  .profile { border-bottom: 1px solid var(--border); }
  .banner { aspect-ratio: 3 / 1; background: var(--banner) center / cover no-repeat; }
  .p-body { padding: 12px 16px 0; position: relative; }
  .p-avatar {
    width: 25%; min-width: 48px; max-width: 134px; aspect-ratio: 1;
    border-radius: 50%;
    border: 4px solid var(--bg);
    background: var(--media-bg) center / cover no-repeat;
    margin-top: -15%;
  }
  .p-name { font-size: 20px; font-weight: 800; margin-top: 8px; line-height: 1.2; }
  .p-handle { color: var(--sub); }
  .p-bio { margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .tabs { display: flex; margin-top: 16px; }
  .tab { flex: 1; text-align: center; color: var(--sub); font-weight: 500; padding: 16px 0 0; }
  .tab span { display: inline-block; padding-bottom: 14px; }
  .tab.on { color: var(--text); font-weight: 700; }
  .tab.on span { border-bottom: 4px solid var(--link); border-radius: 2px; padding-bottom: 10px; }

  /* ポスト */
  .post {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  /* スレッドの続きがあるポストは、下の境界線を消してアイコンの下に縦線を引く */
  .post.has-next { border-bottom: 0; padding-bottom: 0; }
  .post.has-prev { padding-top: 4px; }
  .side { display: flex; flex-direction: column; align-items: center; flex: none; width: 40px; }
  .side .line { flex: 1; width: 2px; background: var(--thread); margin-top: 4px; min-height: 8px; }
  .avatar {
    width: 40px; height: 40px; flex: none;
    border-radius: 50%;
    background: var(--media-bg) center / cover no-repeat;
  }
  .main { flex: 1; min-width: 0; }
  .post.has-next .main { padding-bottom: 12px; }
  .head { display: flex; gap: 4px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  .handle, .dot, .time { color: var(--sub); flex: none; }
  .handle { overflow: hidden; text-overflow: ellipsis; flex-shrink: 2; min-width: 0; }
  .text { margin-top: 2px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .media { margin-top: 12px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--media-bg); }
  .media img { display: block; width: 100%; max-height: 510px; object-fit: cover; }
  .hl { color: var(--link); }
  .actions { display: flex; justify-content: space-between; margin-top: 12px; max-width: 425px; color: var(--sub); font-size: 13px; }
  .act { display: flex; align-items: center; gap: 4px; min-width: 40px; }
  .act svg { width: 18.75px; height: 18.75px; fill: currentColor; }

  .empty { padding: 48px 32px; text-align: center; color: var(--sub); border-bottom: 1px solid var(--border); }
  .empty b { display: block; color: var(--text); font-size: 20px; font-weight: 800; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="viewport">
  <div id="topbar">
    <svg class="back" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
    <div>
      <div class="t-name" id="tName"></div>
      <div class="t-count" id="tCount"></div>
    </div>
  </div>
  <div id="track"></div>
</div>

<script>
// Who Typed? 展示用フィード
// 展示が X に投稿したポスト（posts/log.jsonl）を、X のプロフィール画面に近い見た目で
// 最新から過去へ自動スクロールし続ける。一番古いポストの次は先頭に戻る。
// 設定は URL で変える（例: /feed?speed=60&theme=light）
(() => {
  'use strict';

  const DEFAULTS = {
    theme: 'auto',          // 'auto'=スマホの設定に合わせる / 'dark' / 'light'（画面のダブルタップでも切り替えられる）
    speed: 40,              // スクロール速度（px/秒）
    pollSeconds: 5,         // 新しい投稿を確認する間隔（秒）
    onNewPost: 'jump',      // 'jump'=新着が来たら先頭に戻る / 'wait'=一周してから反映
    reloadHours: 6,         // 長時間運用の保険として、この時間ごとにページを再読み込み（0で無効）
    showTopbar: true,       // 上部バーを表示
    showProfile: true,      // ループの先頭にプロフィールを表示
    startDelay: 2,          // 先頭（最新）で止まる秒数
  };
  const cfg = { ...DEFAULTS };
  const q = new URLSearchParams(location.search);
  for (const k of Object.keys(DEFAULTS)) {
    if (!q.has(k)) continue;
    const v = q.get(k);
    cfg[k] = typeof DEFAULTS[k] === 'number' ? Number(v) : typeof DEFAULTS[k] === 'boolean' ? v !== 'false' && v !== '0' : v;
  }

  const $ = (id) => document.getElementById(id);
  const viewport = $('viewport');
  const track = $('track');

  const DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#3a3f45"/><circle cx="50" cy="40" r="18" fill="#8b98a5"/><rect x="22" y="64" width="56" height="30" rx="15" fill="#8b98a5"/></svg>');
  let profile = { name: '', handle: '', avatar: '', banner: '', bio: '' };
  let posts = [];
  let signature = null;
  let idx = -1;          // 次に描画するポストの位置（-1 = プロフィール）
  let offset = 0;        // track の translateY
  let trackH = 0;
  let pausedUntil = 0;
  let jumping = false;

  // ---- 時刻表示（X の日本語表記に合わせる） ----
  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const sec = Math.floor((now - d) / 1000);
    if (sec < 60) return `${Math.max(sec, 1)}秒`;
    if (sec < 3600) return `${Math.floor(sec / 60)}分`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}時間`;
    if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日`;
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function bgImage(e, src) { e.style.backgroundImage = `url("${(src || DEFAULT_AVATAR).replace(/"/g, '%22')}")`; }

  // @メンションと#ハッシュタグを青字にする
  const TAG_RE = /(@[A-Za-z0-9_]{1,15}|[#＃][^\s#＃!-\/:-@\[-^`{-~、。！？「」『』（）【】・…]+)/g;
  function appendHighlighted(parent, str) {
    let last = 0;
    for (const m of str.matchAll(TAG_RE)) {
      if (m.index > last) parent.appendChild(document.createTextNode(str.slice(last, m.index)));
      parent.appendChild(el('span', 'hl', m[0]));
      last = m.index + m[0].length;
    }
    if (last < str.length) parent.appendChild(document.createTextNode(str.slice(last)));
  }

  const ICONS = {
    reply: 'M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z',
    repost: 'M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z',
    like: 'M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z',
    views: 'M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z',
  };
  function action(name) {
    const a = el('div', 'act');
    a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
    return a;
  }

  // ---- 描画 ----
  function renderProfile() {
    const wrap = el('div', 'profile');
    const banner = el('div', 'banner');
    if (profile.banner) bgImage(banner, profile.banner);
    wrap.appendChild(banner);
    const body = el('div', 'p-body');
    const av = el('div', 'p-avatar');
    bgImage(av, profile.avatar);
    body.appendChild(av);
    body.appendChild(el('div', 'p-name', profile.name));
    if (profile.handle) body.appendChild(el('div', 'p-handle', profile.handle));
    if (profile.bio) {
      const bio = el('div', 'p-bio');
      appendHighlighted(bio, profile.bio);
      body.appendChild(bio);
    }
    const tabs = el('div', 'tabs');
    ['ポスト', '返信', 'ハイライト', 'メディア'].forEach((t, i) => {
      const tab = el('div', 'tab' + (i === 0 ? ' on' : ''));
      tab.appendChild(el('span', null, t));
      tabs.appendChild(tab);
    });
    body.appendChild(tabs);
    wrap.appendChild(body);
    return wrap;
  }

  function renderEmpty() {
    const box = el('div', 'empty');
    box.appendChild(el('b', null, 'まだポストはありません'));
    box.appendChild(document.createTextNode('展示で投稿されると、ここに表示されます'));
    return box;
  }

  function renderPost(p) {
    const art = el('article', 'post' + (p.hasNext ? ' has-next' : '') + (p.hasPrev ? ' has-prev' : ''));
    const side = el('div', 'side');
    const av = el('div', 'avatar');
    bgImage(av, profile.avatar);
    side.appendChild(av);
    if (p.hasNext) side.appendChild(el('div', 'line'));
    art.appendChild(side);

    const main = el('div', 'main');
    const head = el('div', 'head');
    head.appendChild(el('span', 'name', profile.name));
    if (profile.handle) head.appendChild(el('span', 'handle', profile.handle));
    head.appendChild(el('span', 'dot', '·'));
    head.appendChild(el('span', 'time', formatTime(p.at)));
    main.appendChild(head);

    const text = el('div', 'text');
    appendHighlighted(text, p.text);
    main.appendChild(text);
    if (p.photo) {   // 手元写真（スレッドの1件目）
      const media = el('div', 'media');
      const img = el('img');
      img.src = p.photo; img.alt = ''; img.decoding = 'async';
      media.appendChild(img);
      main.appendChild(media);
    }

    const acts = el('div', 'actions');
    for (const n of ['reply', 'repost', 'like', 'views']) acts.appendChild(action(n));
    main.appendChild(acts);

    art.appendChild(main);
    return art;
  }

  // 次に並べる要素。プロフィール → 新しいポスト … 古いポスト → プロフィール … の順でループする
  function nextNode() {
    if (idx === -2) return null; // ポストが無いときは、プロフィールと案内だけを出して止める
    if (idx === -1) {
      idx = 0;
      if (cfg.showProfile) return renderProfile();
    }
    if (!posts.length) {
      idx = -2;
      return renderEmpty();
    }
    const node = renderPost(posts[idx]);
    idx++;
    if (idx >= posts.length) idx = -1;
    return node;
  }

  // 画面の下に十分なポストを足し、上に流れて見えなくなったものは消す（長時間運用でメモリを増やさない）
  function fill() {
    const vh = viewport.clientHeight;
    let guard = 0;
    while (offset + trackH < vh * 2.5 && guard++ < 20) {
      const n = nextNode();
      if (!n) break;
      track.appendChild(n);
      trackH = track.offsetHeight;
    }
  }
  function trim() {
    const vh = viewport.clientHeight;
    let first = track.firstElementChild;
    while (first && first.nextElementSibling) {
      const h = first.offsetHeight;
      if (offset + h > -vh) break;
      track.removeChild(first);
      offset += h;
      trackH -= h;
      first = track.firstElementChild;
    }
  }
  function setTransform() { track.style.transform = `translate3d(0, ${offset.toFixed(2)}px, 0)`; }

  function resetToTop() {
    track.textContent = '';
    idx = -1;
    offset = 0;
    trackH = 0;
    fill();
    setTransform();
    pausedUntil = performance.now() + cfg.startDelay * 1000;
  }

  // 新着が来たら、フェードアウト → 先頭に戻る → フェードイン
  function jumpToTop() {
    if (jumping) return;
    jumping = true;
    track.classList.add('fade');
    setTimeout(() => {
      resetToTop();
      track.classList.remove('fade');
      jumping = false;
    }, 650);
  }

  new ResizeObserver(() => { trackH = track.offsetHeight; }).observe(track);

  let lastT = performance.now();
  let lastStep = 0;
  function step(t) {
    const dt = Math.min(Math.max((t - lastT) / 1000, 0), 0.1);
    lastT = t;
    lastStep = performance.now();
    if (!jumping && posts.length > 0 && t >= pausedUntil) {
      offset -= cfg.speed * dt;
      trim();
      fill();
      setTransform();
    }
  }
  let rafPending = false;
  function schedule() {
    if (rafPending) return; // 描画ループを二重に走らせない
    rafPending = true;
    requestAnimationFrame(frame);
  }
  function frame(t) {
    rafPending = false;
    step(t);
    schedule();
  }
  // 端末によっては復帰後などに requestAnimationFrame が止まることがあるため、
  // 止まっていたらタイマーで動かし続け、描画ループもかけ直す
  function watchdog() {
    if (performance.now() - lastStep > 500) {
      step(performance.now());
      schedule();
    }
  }

  // ---- データ読み込み ----
  // サーバーは ETag を返すので、変わっていなければ中身をダウンロードしない
  async function load() {
    const r = await fetch('/api/feed', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`feed: ${r.status}`);
    return r.json();
  }

  function apply(data) {
    profile = { ...profile, ...(data.profile || {}) };
    const list = data.posts || [];
    const sig = list.map((p) => p.id).join(',');
    const changed = sig !== signature;
    // 'wait' モードでは描画位置を新着の件数ぶんずらし、同じポストが二度出ないようにする
    if (changed && idx > 0 && posts.length) idx = Math.min(idx + Math.max(list.length - posts.length, 0), list.length - 1);
    const wasEmpty = posts.length === 0;
    posts = list;
    signature = sig;
    $('tName').textContent = profile.name;
    $('tCount').textContent = `${data.total ?? posts.length} 件のポスト`;
    return { changed, wasEmpty };
  }

  async function poll() {
    try {
      const { changed, wasEmpty } = apply(await load());
      if (!changed) return;
      if (wasEmpty || cfg.onNewPost === 'jump') jumpToTop();
    } catch (e) {
      // 通信が切れても、表示中のデータでそのまま続ける
      console.warn('poll failed', e);
    }
  }

  // ---- 画面の自動消灯を防ぐ ----
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* 対応していない端末では端末側の自動ロックをオフにする */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('pointerdown', keepAwake);

  // ---- ダーク／ライトの切り替え ----
  // 優先順位：ダブルタップで選んだもの（端末に保存）→ URL の theme → スマホの設定
  const THEME_KEY = 'whoTypedFeedTheme';
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  function savedTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }
  function currentTheme() {
    const t = savedTheme() || cfg.theme;
    if (t === 'dark' || t === 'light') return t;
    return systemDark.matches ? 'dark' : 'light';
  }
  function applyTheme() {
    const t = currentTheme();
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#ffffff' : '#000000';
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 保存できない端末では、再読み込みまで有効 */ cfg.theme = next; }
    applyTheme();
  }
  systemDark.addEventListener('change', applyTheme);
  // ダブルタップ（0.35秒以内に近い場所を2回タップ）で切り替える
  let lastTap = null;
  document.addEventListener('pointerup', (e) => {
    const now = performance.now();
    if (lastTap && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      lastTap = null;
      toggleTheme();
    } else {
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
  });

  async function start() {
    applyTheme();
    if (!cfg.showTopbar) $('topbar').style.display = 'none';

    for (;;) {
      try { apply(await load()); break; }
      catch (e) { await new Promise((r) => setTimeout(r, 5000)); }
    }
    resetToTop();
    lastT = performance.now();
    schedule();
    setInterval(watchdog, 250);
    setInterval(poll, Math.max(cfg.pollSeconds, 2) * 1000);
    if (cfg.reloadHours > 0) setTimeout(() => location.reload(), cfg.reloadHours * 3600 * 1000);
    keepAwake();
  }

  start();
})();
</script>
</body>
</html>
